    Mode: >-
      How the CSV is read — a single Row or Column by Index, or the whole CSV rendered as a Grid by
      row or column.
    index: Row or Column number to extract, used in Extract Row/Extract Column mode.
    IgnoreHeaderRow: Offsets the first index position to skip a labelled header line.
    Input: The CSV-formatted block of text to view.
    ShowDump: Prints diagnostic output to the Console window.
    ShowInput: Reveals the wire for the Input connection in the Flow view.
    DisplayLines: Number of lines shown in the Input text box in the Inspector.
    ScriptVal: Read-only — the extracted row/column/grid data, shown in a ScriptVal viewer.
