  params:
    Level: Overall brightness/opacity multiplier for the line.
    Filter: 'Anti-aliasing filter used to soften the line''s edges: Box, Bartlett, Multi-box, or Gaussian.'
    SoftEdge: Additional edge softness, blended on top of the Filter setting.
    Width: Line thickness, as a fraction of frame size.
    BorderWidth: Width of an additional outline drawn around the line.
    LineType: 'Dash pattern for the line: Solid, Dash, Dot, Dash Dot, or Dash Dot Dot.'
    JoinType: 'Corner style where line segments meet: Bevel, Miter, or Round.'
    CloseShape: Connects the last point back to the first, closing the polyline into a loop.
    ShowDump: Prints the ScriptVal point table to the console each frame.
    Input: Background image the line is drawn onto.
    ScriptVal: Lua table of XY point pairs defining the polyline, e.g. `{ {0.38, 0.53}, {0.44, 0.49}, ... }`.
