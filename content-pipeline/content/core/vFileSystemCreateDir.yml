  description:
    - >-
      The "Text" field is used to define the desired folder path. Any required intermediate
      subfolders are created at the same time. When enabled, the "\[x\] Use Parent Directory"
      checkbox allows you to enter a filepath into the "Text" field. The base folder path for the
      specified file will be used for the directory creation task.
