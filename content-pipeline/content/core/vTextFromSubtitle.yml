  params:
    Input: The SRT subtitle file content to extract text from.
    DisplayLines: Number of lines shown in the Input text box in the Inspector.
    WrapLines: Wraps long lines in the Input text box instead of scrolling horizontally.
    RemoveHTML: Strips HTML markup (e.g. `<i>`) from the extracted subtitle text.
    RemoveHour: Subtracts the 1-hour offset some SRT exports add to their starting timecode.
    TimingMode: >-
      Selects which subtitle line to return — by Timecode (matches the comp's current time) or by
      Index (a fixed line number).
    FPS: Frame rate used to convert SRT timecodes to frame numbers in Timecode mode.
    SequenceStartFrame: Shifts the frame numbering used for timecode matching forwards or backwards.
    Index: Subtitle line number to return, used in Index timing mode.
    ShowInput: Reveals the wires for the Sequence Offset/Index connections in the Flow view.
