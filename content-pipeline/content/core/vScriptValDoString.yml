tool: vScriptValDoString
datatype: ScriptVal
function: Script
legacy_names: []
curated:
  tagline: >-
    Return a ScriptVal object from running a string of Lua code The ScriptVal based input connection
    on the node can be accessed in the script using a Lua table variable named "tbl".
  overview: null
  description:
    - >-
      The ScriptVal based output connection on the node receives the data that is defined by the
      "return" command. The "Script Header Wire" input is used to specify a text datatype connection
      of code that is appended to the top of the Lua Script field contents when run. The script
      content connected to the Script Header Wire field is typically sourced from a
      vTextCreateMultiline or vTextFromFile node. The vScriptValMerge node can be used to combine
      multiple ScriptVal objects before they are passed into the vScriptValDoString node. In your
      Lua Script code you can iterate through each record in the Lua table data using: for i, v in
      ipairs(tbl) do end If you need to temporarily troubleshoot the internals of what your code is
      doing in the vScriptValDoString node there are two diagnostic checkbox controls labelled "Show
      Code" and "Show Dump". The output from those options is displayed in the Console window. For
      performance reasons you probably want to leave those options turned off most of the time when
      rendering long sequences in Fusion to reduce the Console logging overhead.
  features: []
  connections: []
  difficulty: null
  related:
    - name: vScriptValDoFile
    - name: vScriptValDoStringMultiplex
  params:
    ScriptVal: >-
      Optional ScriptVal input, accessible in the script as the Lua table variable `tbl`. Use
      vScriptValMerge first to combine several ScriptVal objects into one before wiring it here.
    Header: >-
      Optional wired-in Lua source prepended to the script before it runs — typically sourced from a
      vTextCreateMultiline or vTextFromFile node, for shared helper functions.
    InSource: Selects and activates the node connected to Script Header Wire — a quick way to jump to it.
    Input: >-
      Lua code to execute, e.g. `for i, v in ipairs(tbl) do end`. Its `return` value becomes the
      node's ScriptVal output.
