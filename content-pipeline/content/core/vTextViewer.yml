tool: vTextViewer
datatype: Text
function: Utility
legacy_names: []
curated:
  tagline: >-
    Displays the Fusion Text object contents in the Inspector The vTextViewer node is a handy way to
    view multi-line text based data type content using the Inspector.
  overview: null
  description:
    - >-
      The "Display Lines" control is used to adjust how many visible lines of text are shown in the
      preview area at once. This number can be lowered if you want to have the vTextViewer node
      shortened to reduce the amount of vertical screen space used in the Inspector. The "Wrap
      Lines" checkbox makes it possible to enable/disable line wrapping in the text preview area.
  features: []
  connections: []
  difficulty: null
  related:
    - name: vTextDelay
    - name: vTextDump
    - name: vTextExpandEscapedCharacters
    - name: vTextFromCSVViewer
  params:
    Input: The text value to display, read-only, in the Inspector.
    ShowDump: Prints diagnostic output to the Console window.
    FontSize: Text size used in the preview area.
    DisplayLines: Number of lines shown in the preview area at once.
    WrapLines: Wraps long lines in the preview area instead of scrolling horizontally.
