  overview: null
  description:
    - >-
      Often PID values are the identifier used to tell an external program to gracefully quit. A PID
      number can also be used by the "renice" terminal utility to help balance the compute load on a
      system by scaling back the resource hogging level of a single dominant program that is
      reducing the overall interactivity of the host computer.
