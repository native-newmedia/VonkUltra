tool: vScriptValAccumulator
datatype: ScriptVal
function: Temporal
legacy_names: []
curated:
  tagline: >-
    Temporally concatenateScriptVal elements into one table This node can be thought of as a
    ScriptVal based merge node that works across a time range.
  overview: null
  description:
    - >-
      It can be used to create Lua Table based array elements that are built over time from
      dynamically generated tables of data. The "Start Frame" control will often be driven by a
      vNumberCompRenderStart or vNumberCompGlobalStart node. The "End Frame" control will often be
      driven by a vNumberCompRenderEnd or vNumberCompGlobalEnd node. The "Step" control allows for
      frame skipping to occur. The "Sort List" checkbox works on a line-by-line basis to
      alphabetically sort the results generated by the node. If you want to stop a
      vScriptValAccumulator node from re-rendering on subsequent frames in the Fusion timeline, you
      can add a "vScriptValTimeSpeed" node right afterwards and set the Speed to 0 and the Delay to
      0. The data combined together by a vScriptValAccumulator node can be separated again into
      individual items using the vScriptValGetElementToTable node.
  features: []
  connections: []
  difficulty: null
  related:
    - name: vScriptValTimeSpeed
    - name: vScriptValTimeStretch
  params:
    ScriptVal: >-
      ScriptVal sampled once per frame across the Start/End range and concatenated into a single
      table.
    StartFrame: First frame to sample — often driven by vNumberCompRenderStart or vNumberCompGlobalStart.
    EndFrame: Last frame to sample — often driven by vNumberCompRenderEnd or vNumberCompGlobalEnd.
    Step: Frame increment between samples — use a value above 1 to sample more sparsely.
    Sort: Sorts each line of the result alphabetically.
    ShowInput: Reveals the wire for the ScriptVal connection in the Flow view.
