  params:
    Refresh: Button — re-checks/refreshes the submitted render job's status.
    File: Path to the .comp or .dfq file to submit to the Render Manager.
    RenderMode: >-
      Which frame range gets rendered — the current frame, the comp's Render Start/End range, a
      manual Custom Frame Range, or the range stored in the comp file itself (Predefined Frame
      Range).
    StartFrame: First frame to render, used when Render Mode is Custom Frame Range.
    EndFrame: Last frame to render, used when Render Mode is Custom Frame Range.
    ShowDump: Shows raw submission/debug output from the Render Manager.
    ShowInput: Reveals the wire for the Comp File connection in the Flow view.
    ShowRenderManager: Button — opens the Fusion Render Manager window.
