legacy_text: >-
  Launch a command-line shell task in the background via `bmd.executebg()` The "Wait" checkbox can
  be used to make the node act in a blocking fashion that will pause the rendering of this branch of
  the comp until the launched process has completed and exited. Note: Make sure to write in the
  absolute filepath for the executable program you want to run. You can discover this by typing
  "which SomeProgramName" into the Terminal window on macOS/Linux: which open /usr/bin/open Also,
  the vTextShellBG node is used to launch a program with its command line arguments specified. It is
  not a full terminal environment so shell redirection approaches and expanding environment variable
  tokens in the command string are not supported. If you need those extended command line scripting
  features, write out a temporary .bat/.sh/.command file to disk then use vTextShellBG to run the
  script.
