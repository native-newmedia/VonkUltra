tool: vNumberFromCSV
datatype: Number
function: Text
legacy_names: []
curated:
  tagline: >-
    Creates a Fusion Number object by extracting a single cell from a CSV formatted block of text
    The "Row" control is used to define the CSV line number to read.
  overview: null
  description:
    - >-
      The "Column" control is used to increment through each set of comma separated entries on a
      single line of CSV input data. The "Ignore Header Row" checkbox will offset the first index
      position to start at line 2 in the CSV file. This will skip over a labelled header row in the
      source document to avoid that information being accessed as part of the ingested data.
  features: []
  connections: []
  difficulty: null
  related:
    - name: vNumberFromText
    - name: vNumberXYZFromCSV
  params:
    Row: CSV line number to read.
    Column: Comma-separated field on that line to return.
    IgnoreHeaderRow: Offsets Row by 1 so a labelled header line is skipped.
    Input: The CSV-formatted block of text to read from.
    DisplayLines: Number of lines shown in the Input text box in the Inspector.
    WrapLines: Wraps long lines in the Input text box instead of scrolling horizontally.
    ShowInput: Reveals the wire for the Input connection in the Flow view.
    GetHeadingBtn: Renames this node to `csv_<value>`, using the Row/Column cell as the new name.
