tool: vImageDelay
datatype: Image
function: Utility
legacy_names: []
curated:
  tagline: Creates a Delay while passing a Fusion Image object The delay effect is measured in seconds.
  overview: null
  description:
    - >-
      This node is implemented internally using the "`bmd.wait()`" function. Among several use cases
      one can find for a tool that can momentarily pause rendering; it can be used to simulate a
      slow to render comp task when testing a render farm program. It also has applications when
      running a command line task via the Vonk ProcessOpen node and the system requires a momentary
      pause.
  features: []
  connections: []
  difficulty: null
  related: []
  params:
    Input: Image passed through unchanged after the delay.
    Delay: >-
      Pause duration in seconds, implemented via `bmd.wait()`. Useful for throttling command-line
      tasks (e.g. vImageProcessOpen) that need a moment to complete, or for simulating a slow render
      step.
    ShowInput: Reveals the wire for the Input connection in the Flow view.
