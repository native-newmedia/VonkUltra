tool: vNumberCompProxy
datatype: Number
function: Comp
legacy_names: []
curated:
  tagline: >-
    Returns the comp's Proxy state The True and False inputs on the node let you define a custom
    value that is returned for the Proxy logic state.
  overview: null
  description:
    - >-
      Setting the True and False inputs to a value of "True = 2" & "False = 1" makes it easier to
      directly connect the vNumberCompProxy output to a Switch node's Which input that starts the
      first switchable input connection as "Which = 1". Note: There is a slight instability that can
      occur with this node if you rapidly toggle the "Prx" state On/Off while playing back footage
      in the Fusion timeline with the vNumberCompProxy node active. A solution to this issue is
      being explored.
  features: []
  connections: []
  difficulty: null
  related:
    - name: vNumberCompCurrentTime
    - name: vNumberCompFPS
    - name: vNumberCompFrameFormat
    - name: vNumberCompGlobalEnd
  params:
    'True': Custom value returned when the comp's Proxy state is on.
    'False': Custom value returned when the comp's Proxy state is off.
    ShowInput: Reveals the wires for the True/False connections in the Flow view.
legacy_text: >-
  Returns the comp's Proxy state The True and False inputs on the node let you define a custom value
