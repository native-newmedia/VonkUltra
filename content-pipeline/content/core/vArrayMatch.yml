  params:
    Input: JSON array text to search.
    Pattern: >-
      A Lua pattern used to isolate matching values, e.g. `cryptomatte/[a-z0-9]+/manifest` to pull
      Cryptomatte manifest entries out of image metadata parsed via vArrayFromMetadata.
    ShowInput: Reveals the wire for the Input connection in the Flow view.
