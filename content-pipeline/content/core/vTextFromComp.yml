tool: vTextFromComp
datatype: Text
function: IO
legacy_names: []
curated:
  tagline: >-
    Reads text strings from a Fusion .comp file This node tunnels inside of an external Fusion .comp
    file on disk and extracts string elements.
  overview: null
  description:
    - >-
      These text strings are typically filepaths. The "File" text field specifies which .comp file
      should be parsed. The "Match" text field helps sort the content returned to filter the
      results. The "File Exists" checkbox lets you further filter the results by looking on disk to
      see if the text string lines up with an actual file that exists. The "Expand PathMaps"
      checkbox will automatically convert any relative filepaths into absolute filepaths on the
      output. The "Sort List" checkbox works on a line-by-line basis to alphabetically sort the
      results generated by the node. The "Remove Duplicates" checkbox is used to remove any line
      entry that is a duplicate entry, meaning the content is not unique.
  features: []
  connections: []
  difficulty: null
  related:
    - name: vTextFromClipboard
    - name: vTextFromFile
    - name: vTextFromNet
    - name: vTextFromZip
  params:
    File: Path to the .comp file to extract text strings from.
    Match: Filters the extracted strings to those matching this pattern.
    FileExists: Only returns strings that resolve to a file that actually exists on disk.
    ExpandPathMaps: Converts relative PathMap-based filepaths into absolute paths in the output.
    Sort: Alphabetically sorts the returned strings on a line-by-line basis.
    RemoveDuplicates: Drops any returned line that duplicates one already in the results.
    ShowInput: Reveals the wire for the File connection in the Flow view.
