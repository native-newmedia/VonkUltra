    Input: >-
      The upstream Matrix connection to link wirelessly. The wire stays hidden in the Flow view
      unless Show Input is enabled — data still passes through to Output as normal.
    ShowInput: >-
      Reveals the wire connecting Input, so it's visible in the Flow/Nodes view like a normal
      connection.
    GetColorBtn: >-
      Copies the connected node's tile and text colour onto this node — a quick way to visually
      match a wireless link with its source.
    GetNameBtn: >-
      Renames this node to `wire_<source node name>`, so it's identifiable as the wireless
      counterpart of its source.
    GetSourceBtn: Selects and activates the connected source node in the flow — a quick way to jump to it.
