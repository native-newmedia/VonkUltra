  params:
    File: Path to the file or folder to change permissions on.
    Mode: Access permission as an octal-style number, e.g. `755` or `777`.
    Recursive: Applies the permission change to everything inside the folder, not just the folder itself.
    ShowInput: Reveals the wire for the File connection in the Flow view.
