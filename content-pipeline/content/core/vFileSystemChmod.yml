tool: vFileSystemChmod
datatype: FileSystem
function: General
legacy_names: []
curated:
  tagline: >-
    Change a file/folder's access permissions The "File" textfield is used to specify a file or
    folder path.
  overview: null
  description:
    - >-
      The "Mode" control is used to specify the file mode (access permission) as an integer number.
      This is typically an octal value like "777", "755", etc. The "Recursive" checkbox allows you
      to apply the access permission changes to items inside a folder. Note: This node works on
      macOS and Linux systems only due to the use of the UNIX "chmod" utility.
  features: []
  connections: []
  difficulty: null
  related:
    - name: vFileSystemColorTags
    - name: vFileSystemCreateDir
