curated:
  tagline: >-
    Gets the element of a JSON array The "Index" control is used to access individual entries from a
    JSON array type of object.
  overview: null
  description:
    - >-
      The node expects a text based JSON array object as the input. The output from the
      vJSONGetElement node is a text based data type. It is possible to translate the text based
      output from this node into numerical values via the vNumberFromText node. The first item is
      accessed at Index position 1.
