      12K](https://www.blackmagicdesign.com/products/blackmagicursaminipro) camera with a Cooke
      Optics PL-mount lens is capable of holding this YAML metadata recorded lens information
      internally. This is useful for supporting better data interchange between VP (Virtual
      Production) onset ICVFX (In-Camera VFX) departments and subsequent post-production workflows
      carried out by external vendors.
