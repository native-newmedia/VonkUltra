    - >-
      sensors and encoders like the [Cooke Optics /i
      Technology](https://cookeoptics.com/i-technology/) metadata system. YAML metadata exchange is
      also starting to be used by other Cine lens manufacturers, in match-moving and tracking
      packages like [SynthEyes](https://www.ssontech.com/) and PFTrack, and as part of data exchange
      approaches like [OpenTimelineIO](https://github.com/reinecke/otio-cookelensmetadata), too.
