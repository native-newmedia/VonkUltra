  description:
    - >-
      The "Action Params" text field contents are placed inside a Lua table like element \{\}. This
      information is used to specify any extra attributes you would like to pass along to the action
      when it is run. The "Wrap Lines" checkbox makes it possible to enable/disable line wrapping in
      the text preview area. DoAction is launched via the "self.Comp:Execute()" function so it is
      run asynchronously.
