tool: vTextFromFile
datatype: Text
function: IO
legacy_names: []
curated:
  tagline: >-
    Reads a Text string from a file This node is used to access a block of text from a plain-text
    format style of document stored on disk.
  overview: null
  description:
    - >-
      This is useful for accessing CSV (Comma Separated Value), TSV (Tab Separated Value), IFL
      (Image File Lists), or other external data resources. The "Input" text field is used to
      specify the disk-based filename of the plain-text document to be read. The "Remove
      Non-Printable Characters" checkbox is used to remove ASCII invisible control characters from
      the text stream. This allows the node to be used to extract ASCII strings from binary files.
      The output from this node is a text data type.
  features: []
  connections: []
  difficulty: null
