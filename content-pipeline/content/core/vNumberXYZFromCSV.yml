  params:
    Row: CSV line number to read all three values from.
    ColumnX: Comma-separated field on that line used for the X value.
    ColumnY: Comma-separated field on that line used for the Y value.
    ColumnZ: Comma-separated field on that line used for the Z value.
    ScaleX: Multiplier applied to the X value when Apply Scale is on.
    ScaleY: Multiplier applied to the Y value when Apply Scale is on.
    ScaleZ: Multiplier applied to the Z value when Apply Scale is on.
    ApplyScale: Enables the Scale X/Y/Z multipliers.
    Input: The CSV-formatted block of text to read from.
    IgnoreHeaderRow: Offsets Row by 1 so a labelled header line is skipped.
    DisplayLines: Number of lines shown in the Input text box in the Inspector.
    WrapLines: Wraps long lines in the Input text box instead of scrolling horizontally.
    ShowInput: Reveals the wire for the Input connection in the Flow view.
