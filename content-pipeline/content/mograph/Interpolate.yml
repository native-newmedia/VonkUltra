operation: Interpolate
tools:
  Array: vArrayInterpolate
  ScriptVal: vScriptValInterpolate
  JSON: vJSONInterpolate
legacy_names: []
curated:
  tagline: Blends two arrays value by value with a Progress amount and an easing curve.
  overview: >-
    vArrayInterpolate takes Input A and Input B and outputs values between them. Progress 0 gives A,
    1 gives B, and Select Easing shapes the curve in between.
  description:
    - >-
      Each value is A + (B - A) * ease(Progress). Lists inside the arrays are blended value by
      value, so XYZ points work. If the arrays differ in length, both are cut to the shorter one.
      Progress is limited to 0 to 1 and defaults to 0, which outputs Input A.
    - >-
      Select Easing chooses linear, easeInQuad, easeOutQuad, easeInOutQuad, easeInExpo, easeOutExpo
      or easeInOutExpo. The easing function is applied to Progress before the blend.
    - Show Input makes a Progress input port available on the node, so the value can be connected.
  features:
    - title: Value by value blend
      desc: Every number in A is mixed with the matching number in B.
    - title: Seven easings
      desc: Linear, three quad curves and three expo curves.
    - title: Nested lists
      desc: Points and other lists inside the array are blended too.
    - title: Progress port
      desc: Show Input exposes Progress as a connectable input.
  connections:
    - label: Morph a grid into a sphere and draw
      lines:
        - vArrayPointsOnGrid.Output -> vArrayInterpolate.ArrayA
        - vArrayPointsOnSphere.Output -> vArrayInterpolate.ArrayB
        - vArrayInterpolate.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Blend a circle into a rectangle
      lines:
        - vArrayPointsOnCircle.Output -> vArrayInterpolate.ArrayA
        - vArrayPointsOnRectangle.Output -> vArrayInterpolate.ArrayB
        - vArrayInterpolate.Output -> vArrayTranslate.Input
  difficulty: Intermediate
  related:
    - name: vArrayApplyMask
      desc: Blends Base and Modified points per point using a 0-1 mask.
    - name: vArrayMaterialEasing
      desc: Animates points using Material Design 3 easing with staggered offsets.
    - name: vArrayMapRange
      desc: Applies range mapping operations to an Array.
  params:
    progress: Blend position from 0 (Input A) to 1 (Input B). Range 0 to 1, default 0.
    selectEasing: >-
      linear (default), easeInQuad, easeOutQuad, easeInOutQuad, easeInExpo, easeOutExpo or
      easeInOutExpo.
    ShowInput: Shows a Progress input port on the node when on. Default off.
    ArrayA: Values at Progress 0.
    ArrayB: Values at Progress 1.
status:
  source: ai
  state: reviewed
  reviewed_hash: b40f499e13e3
  prompt_version: '1'
  note: >-
    Reviewed in fix batch F1: the code matches its label and registered description, so the fuse was
    not changed. The old texts list the easings as Linear, Ease In, Ease Out, Ease In-Out and Back.
    The control has seven: linear, easeInQuad, easeOutQuad, easeInOutQuad, easeInExpo, easeOutExpo,
    easeInOutExpo. The old text for Show Input says it reveals the Array A and Array B ports. In the
    code it only shows the Progress input port. The old text says the two arrays must have the same
