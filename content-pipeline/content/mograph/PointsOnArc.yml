operation: PointsOnArc
tools:
  Array: vArrayPointsOnArc
  ScriptVal: vScriptValPointsOnArc
  JSON: vJSONPointsOnArc
legacy_names: []
curated:
  tagline: >-
    Distribute a precise point array along an arc — fan layouts, radial data visualisation, animated
    sweeps.
  overview: >-
    vArrayPointsOnArc generates a structured array of 2D or 3D points distributed along a defined
    arc. It is intentionally minimal — the arc geometry is driven entirely by an upstream array
    input, keeping this node as a clean transformer rather than a generator with its own controls.
  description:
    - >-
      vArrayPointsOnArc generates a structured array of 2D or 3D points distributed along a defined
      arc. Where vArrayPointsOnCircle gives you a full 360° ring, PointsOnArc gives you surgical
      control — define the exact start and end angle, the radius, and the center point
      independently. This makes it the right choice for fan-shaped data visualisations, clock-style
      progress indicators, radial label placement, and any layout where the arc needs to occupy a
      specific angular range rather than a full revolution.
    - >-
      The node is driven by its ArrayA input, which defines the angular span as a vArray range. In
      practice this is almost always the output of vArrayCreateMinMax — set Min to your start angle
      and Max to your end angle, and PointsOnArc distributes the requested number of points evenly
      across that range. Because the span comes from an upstream node rather than being hardcoded,
      it stays live: animate or keyframe the Min/Max values and the arc responds every frame without
      breaking the rest of the pipeline.
    - >-
      The Smoothness control sets how many intermediate segments are used to compute the arc
      geometry — higher values produce a rounder, more precise curve, lower values produce a faster,
      more angular approximation. The output is a standard vArray XYZ point table, meaning it slots
      directly into vArrayCameraProjection, vArrayDisplaceValues, vArrayStagger, or any other
      modifier without conversion. A minimal pipeline is three nodes: vArrayCreateMinMax →
      vArrayPointsOnArc → vArrayCameraProjection → vArrayShapeRender with a Background input.
  features:
    - title: Arc span control
      desc: Define precise start and end angles for partial arcs, full circles, or anything in between.
    - title: Min/Max driven
      desc: Accepts a vArrayCreateMinMax input to define the arc span procedurally from data values.
    - title: 2D / 3D output
      desc: Switch between XY pairs and XYZ triples to match your downstream pipeline requirements.
    - title: CameraProjection ready
      desc: >-
        Conforms to standard vArray format — feeds directly into vArrayCameraProjection with no
        conversion.
  connections:
    - label: Standard arc pipeline
      lines:
        - vArrayCreateMinMax.Output -> vArrayPointsOnArc.ArrayA
        - vArrayPointsOnArc.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: With displacement before projection
      lines:
        - vArrayCreateMinMax.Output -> vArrayPointsOnArc.ArrayA
        - vArrayPointsOnArc.Output -> vArrayDisplaceValues.ArrayA
        - vArrayDisplaceValues.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: With staggered animation
      lines:
        - vArrayCreateMinMax.Output -> vArrayPointsOnArc.ArrayA
        - vArrayPointsOnArc.Output -> vArrayStagger.ArrayA
        - vArrayStagger.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
  difficulty: Intermediate
  related:
    - name: vArrayPointsOnCircle
      desc: Full 360° point distribution — use when you need a complete ring rather than a partial arc.
    - name: vArrayPointsOnGrid
      desc: >-
        Rectangular grid layout for matrix-style arrangements — same pipeline pattern, different
        geometry.
    - name: vArrayPointsOnHexagon
      desc: Hex-grid distribution with offset row support — better for packed or organic layouts.
  params:
    smoothness: >-
      Number of interpolated segments used to compute the arc curve. Higher values produce smoother
      arcs; lower values produce faster, more angular results. Values above 50 are rarely needed
      unless rendering at very large scale.
    ArrayA: >-
      Required. The input array that defines the arc's angular span and point count. Connect
      vArrayCreateMinMax here — its X Min/Max define the start and end angles, and its Array Length
      defines how many points are distributed along the arc.
status:
  source: rich-json
  state: imported
  reviewed_hash: null
legacy_text: Generate points on an arc
