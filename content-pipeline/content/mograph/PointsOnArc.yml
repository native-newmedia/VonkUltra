operation: PointsOnArc
tools:
  Array: vArrayPointsOnArc
  ScriptVal: vScriptValPointsOnArc
  JSON: vJSONPointsOnArc
legacy_names: []
curated:
  tagline: Builds an arc of points between each pair of consecutive input points.
  overview: >-
    vArrayPointsOnArc takes an array of points and outputs Smoothness + 1 points on an arc between
    each consecutive pair. With the default Height Factor of 0 each arc is a half circle in the XY
    plane with the two points as its diameter.
  description:
    - >-
      For every pair of neighboring input points the node places Smoothness - 1 points between them
      and keeps the two input points at the ends. Each point is the start point turned around a
      center by an angle that runs from 0 to 180 degrees. With Height Factor 0 the center is the
      middle of the pair, so the arc is a half circle in the XY plane, and Z follows a cosine
      between the two Z values.
    - >-
      Height Factor (hidden, default 0) moves the center sideways by half the distance times the
      factor and lifts the middle of the arc on Z by the factor times the distance. Smoothness runs
      from 1 to 100 with a default of 20. A point shared by two pairs is written twice. Fewer than 2
      input points give an empty output.
  features:
    - title: One arc per pair
      desc: Each pair of neighboring input points gets its own arc.
    - title: Smoothness
      desc: Smoothness sets how many segments each arc has.
    - title: End points kept
      desc: Every arc starts and ends on the input points.
    - title: Hidden height control
      desc: Height Factor bends the arcs and lifts them on Z.
  connections:
    - label: Arcs between line points and draw
      lines:
        - vArrayLine.Output -> vArrayPointsOnArc.ArrayA
        - vArrayPointsOnArc.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Arcs through rectangle corners
      lines:
        - vArrayPointsOnRectangle.Output -> vArrayPointsOnArc.ArrayA
        - vArrayPointsOnArc.Output -> vArrayClosePath.Points
  difficulty: Intermediate
  related:
    - name: vArrayPointsOnCircle
      desc: Generates points on a circle.
    - name: vArrayCubicBezier
      desc: Creates a cubic Bezier path from manually entered control values.
    - name: vArrayResamplePath
      desc: Resamples ordered paths to even spacing by count or distance.
  params:
    smoothness: Number of segments per arc. Range 1 to 100, default 20.
    ArrayA: Points that the arcs connect, in order. Each needs 3 values.
    heightFactor: Hidden control. Bends the arc sideways and lifts it on Z. Slider 0.001 to 1, default 0.
    mul: Hidden control. Multiplier. Read by the code but not used. Default 0.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The old text says the arc angles come from an upstream min and max node. The code reads no
    angles: it builds one arc between each pair of consecutive input points, so the Input must hold
    at least 2 points with 3 values each. Multiplier is hidden and read but not used. Each point
    shared by two pairs appears twice in the output.
legacy_text: Generate points on an arc
