operation: FromSpline
tools:
  Array: vArrayFromSpline
  ScriptVal: vScriptValFromSpline
  JSON: vJSONFromSpline
legacy_names: []
curated:
  tagline: Sample a mask spline into points, either evenly in curve parameter or evenly in distance.
  overview: >-
    vArrayFromSpline reads the Bezier spline of a connected mask when Load Spline (Current Frame) is
    pressed, stores it in the node, and outputs an array of XYZ points sampled along it. Mode
    chooses between uniform parameter spacing and equal distance spacing.
  description:
    - >-
      Load Spline (Current Frame) copies the Bezier polyline of the tool connected to Spline Input,
      at the current time, into the hidden Spline Data control. It also stores the composition frame
      size and pixel aspect. The node samples this stored copy, so a change to the mask is picked up
      only when the button is pressed again.
    - >-
      Each spline segment is a cubic Bezier curve made from its two points and their handles. A
      closed spline includes the segment back to the start. In Uniform mode (0) the samples are
      spaced evenly in curve parameter, so each segment receives the same share of points whatever
      its length. In Distance mode (1) the samples are spaced evenly by arc length over the whole
      spline, with 32 subdivisions of each segment used to measure length. The number of samples
      comes from the hidden Number of Samples control, default 100. All points have Z = 0.
    - >-
      The points are then changed in this order. Flip X and Flip Y negate the values. X is
      multiplied by Width Scale + 0.5, and by the frame aspect (width * pixel aspect X / height *
      pixel aspect Y) when Auto Width is on. Y is converted by the frame height over width ratio
      when Auto Height is on, and multiplied by Height Scale + 0.5. With the defaults (flips on,
      Auto Width off, Auto Height on, both scales 1.5) X is multiplied by 2 and Y is multiplied by 2
      and by the frame height over width ratio.
    - >-
      If no spline is stored, the node falls back to the hidden JSON Point Data text, a JSON list of
      [x, y] or [x, y, z] entries, which goes through the same flips and scales. Only Mode and the
      Load button are visible. The other controls are hidden and can be changed from a script or a
      connection.
  features:
    - title: Mask spline input
      desc: The Bezier spline of a connected mask is sampled, including its handles.
    - title: Two sampling modes
      desc: Uniform spaces samples by curve parameter and Distance spaces them by arc length.
    - title: Stored spline
      desc: >-
        The spline is copied into the node by a button, so the output does not follow later mask
        edits.
    - title: JSON fallback
      desc: JSON Point Data can supply points when no spline is stored.
  connections:
    - label: Sample a mask spline and draw it
      lines:
        - Polygon.Mask -> vArrayFromSpline.SplineInput
        - vArrayFromSpline.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the points before drawing
      lines:
        - Polygon.Mask -> vArrayFromSpline.SplineInput
        - vArrayFromSpline.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Intermediate
  related:
    - name: vArrayFromPolyline
      desc: Samples a path drawn directly in the viewer.
    - name: vArrayCubicBezier
      desc: Creates a cubic Bezier path from manually entered control values.
    - name: vArrayResamplePath
      desc: Resamples ordered paths to even spacing by count or distance.
  params:
    mode: 0 samples evenly in curve parameter, 1 samples evenly by arc length. Range 0 to 1, default 0.
    splineInput: Mask tool whose Bezier spline is read by the Load Spline button.
    SplineData: Hidden control. Stores the spline that was loaded from the mask.
    SourceWidth: Hidden control. Composition frame width stored when the spline is loaded.
    SourceHeight: Hidden control. Composition frame height stored when the spline is loaded.
    SourceAspectX: Hidden control. Composition pixel aspect X stored when the spline is loaded. Default 1.
    SourceAspectY: Hidden control. Composition pixel aspect Y stored when the spline is loaded. Default 1.
    SplineLoad: Button that copies the spline of the connected mask at the current frame into the node.
    jsonPointData: Hidden control. JSON list of points that is used when no spline is stored.
    numSamples: Hidden control. Number of points sampled. Minimum 2, default 100.
    flipX: Hidden control. Negates X. Default on.
    flipY: Hidden control. Negates Y. Default on.
    autoWidth: Hidden control. Multiplies X by the frame aspect ratio. Default off.
    autoHeight: Hidden control. Multiplies Y by the frame height over width ratio. Default on.
    widthScale: Hidden control. X is multiplied by this value plus 0.5. Default 1.5.
    heightScale: Hidden control. Y is multiplied by this value plus 0.5. Default 1.5.
    pointData: Hidden control. JSON list of points that is used when no spline is stored.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    Process() multiplies X and Y by widthScale + 0.5 and heightScale + 0.5, so the defaults of 1.5
    give a factor of 2. Most controls are hidden, including Number of Samples. Fuse logic was not
    changed.
