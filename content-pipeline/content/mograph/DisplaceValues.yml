operation: DisplaceValues
tools:
  Array: vArrayDisplaceValues
  ScriptVal: vScriptValDisplaceValues
  JSON: vJSONDisplaceValues
legacy_names: []
curated:
  tagline: Offsets points by a hashed noise value, limited to a spherical falloff region.
  overview: >-
    vArrayDisplaceValues takes an array of XYZ points and adds a noise offset to each. Amplitude
    sets the size, Noise Scale the noise frequency, and the falloff sphere limits where the offset
    applies.
  description:
    - >-
      Each point moves by noise * Amplitude * falloff on X, Y and Z. The noise is a hash of the
      point position times Noise Scale plus Animation Speed times the render time, with each
      coordinate wrapped by a modulo of Noise Rate. Its value lies between 0 and 1, so a positive
      Amplitude moves points toward positive values.
    - >-
      The default Noise Rate is 0.001. Below 0.0053 the wrapped coordinates are stretched to a range
      of 0 to 1000 before the hash, so points differ. Larger rates run the plain hash, which gives
      few distinct values until the rate reaches about 0.05. Amplitude and Noise Scale default to 0,
      so nothing moves until they are set.
    - >-
      The falloff is max(0, 1 - (distance / radius) ^ tightness), measured from the FallOff Sphere
      position. Invert falloff uses 1 minus that value.
  features:
    - title: Noise displacement
      desc: Each axis uses its own noise value, scaled by Amplitude and the falloff.
    - title: Spherical falloff
      desc: The offset fades with the distance from a sphere position over its radius.
    - title: Invertable falloff
      desc: Invert falloff applies the offset outside the sphere instead of inside.
    - title: Animation Speed
      desc: Animation Speed moves the noise lookup with the render time.
  connections:
    - label: Disturb a grid and draw it
      lines:
        - vArrayPointsOnGrid.Output -> vArrayDisplaceValues.ArrayA
        - vArrayDisplaceValues.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Disturb a circle
      lines:
        - vArrayPointsOnCircle.Output -> vArrayDisplaceValues.ArrayA
        - vArrayDisplaceValues.Output -> vArrayCameraProjection.ArrayA
  difficulty: Intermediate
  related:
    - name: vArrayNoiseOnMesh
      desc: Displaces input points with Perlin or fractal noise along a mesh normal or in 3D.
    - name: vArrayPointsJitter
      desc: Adds jitter to the points of an Array.
    - name: vArrayRippleDisplacer
      desc: Creates animated displacement with time-offset arrays.
  params:
    scaleamount: Multiplies the point position before the noise lookup. Slider -1 to 1, default 0.
    nosie_rate: >-
      Length of the modulo applied to each coordinate in the noise lookup. Slider 0 to 1, default
      0.001. Below 0.0053 the coordinates are stretched to 0 to 1000 before the hash.
    amplitudeamount: Size of the displacement. Slider -1 to 1, default 0.
    sphere_X: X of the falloff sphere center. Slider -1 to 1, default 0.
    sphere_y: Y of the falloff sphere center. Slider -1 to 1, default 0.
    sphere_z: Z of the falloff sphere center. Slider -1 to 1, default 0.
    radius: Radius of the falloff sphere. Minimum 0, slider 0 to 1, default 0.
    falloff_tightness: Exponent in the falloff formula. Slider 0.01 to 1, default 0.1.
    invertfalloff: Uses 1 minus the falloff when on. Default off.
    ArrayA: >-
      Primary point array input. Connect the output of any vArray generator here to apply noise
      displacement to its points.
    animspeed: Added to the noise lookup as this value times the render time. Slider 0 to 5, default 0.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    Rewritten against the fuse after fix batch F4 (branch fix/findings-f4 of vonk-ultra-mograph).
    Noise Rate is the length used for a modulo on each coordinate. The hash floors x + 57 y + 131 z,
    which is always 0 for a rate below about 0.0053, so every point got the same value (0.7182). For
    a rate below 0.0053 the wrapped coordinates are now stretched to 0 to 1000 first, so the points
    differ. Rates from 0.0053 up are unchanged, and those up to about 0.05 still give only a few
    distinct values. A rate of 0 or less used to give NaN. The noise value is between 0 and 1 and is
    never negative, so the displacement is one-sided. Only the control ID nosie_rate has the typo.
    Extra values after the third are dropped. Nothing was run in Fusion.
legacy_text: Displace XYZ positions using noise with spherical falloff
