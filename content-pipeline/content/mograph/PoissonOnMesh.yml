operation: PoissonOnMesh
tools:
  Array: vArrayPoissonOnMesh
  ScriptVal: vScriptValPoissonOnMesh
  JSON: vJSONPoissonOnMesh
legacy_names: []
curated:
  tagline: Scatter points on the surface of an OBJ mesh while keeping a minimum distance between them.
  overview: >-
    vArrayPoissonOnMesh reads an OBJ mesh from a file, a URL or text and outputs up to Point Count
    points on its triangles. Minimum Distance and Rejection Attempts control how closely the points
    may sit together.
  description:
    - >-
      The node reads the vertex and face lines of the OBJ text, multiplies the vertices by Scale
      File Units By, and splits faces with more than three vertices into triangles. Negative face
      indices are supported. Triangles with almost no area are ignored. If the mesh has no usable
      triangle, the node outputs nothing.
    - >-
      For each point, the node picks a random triangle with a probability proportional to its area
      and a random position inside it, then moves the position along the triangle normal by Surface
      Offset. The candidate is kept if it is at least Minimum Distance away, in 3D, from every point
      already kept. A Minimum Distance of 0 turns this check off.
    - >-
      If a candidate is rejected, the node tries again, up to Rejection Attempts times for each
      point. If all attempts fail for one point, the node stops and outputs the points found so far,
      so the result can hold fewer points than Point Count. A larger Minimum Distance, a higher
      Point Count or a smaller mesh makes this more likely.
    - >-
      The random generator is seeded with Random Seed, so the same Seed, mesh and settings give the
      same points. Point Count has a minimum of 2. The check compares each candidate with all
      earlier points, so large point counts get slower.
  features:
    - title: Minimum spacing
      desc: A candidate point is rejected when it is closer than Minimum Distance to a kept point.
    - title: Area-weighted sampling
      desc: Larger triangles receive more candidates.
    - title: Three mesh sources
      desc: Input Source reads the OBJ from a file, a URL or text.
    - title: Repeatable
      desc: A fixed Random Seed gives the same points every time.
  connections:
    - label: Scatter on a loaded mesh and draw
      lines:
        - vArrayPoissonOnMesh.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the points before drawing
      lines:
        - vArrayPoissonOnMesh.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Intermediate
  related:
    - name: vArrayScatterOnMesh
      desc: Scatters points on a mesh without a minimum distance.
    - name: vArrayRelaxScatterOnMesh
      desc: Scatters points on a mesh and relaxes them.
    - name: vArrayMaskScatterOnMesh
      desc: Scatters points on a mesh with a mask.
  params:
    inputsource: Where the OBJ mesh comes from, File, URL or Text. Default File.
    filename: Path of the OBJ file. Shown when Input Source is File.
    url: Address of an OBJ file. Hidden until Input Source is URL.
    input: OBJ text. Hidden until Input Source is Text.
    scale: Multiplier applied to the vertex coordinates. Default 1.
    pointcount: Largest number of points to create. Minimum 2, default 1000.
    seed: Seed of the random generator. Minimum 0, default 0.
    minimumdistance: Smallest distance allowed between two points. 0 turns the check off. Minimum 0, default 0.05.
    rejectionattempts: Number of candidates tried for each point before the node stops. Minimum 1, default 30.
    surfaceoffset: Distance each point is moved along the triangle normal. Default 0.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
