operation: MinMax
tools:
  Array: vArrayMinMax
  ScriptVal: vScriptValMinMax
  JSON: vJSONMinMax
legacy_names:
  - vArrayCreateMinMax
curated:
  tagline: Generate an array of random values where each value in an entry has its own minimum and maximum.
  overview: >-
    vArrayMinMax has no input and outputs an array of random entries. Array length sets the number
    of entries, Pack To sets whether each entry holds X, X Y or X Y Z, and each value has its own
    range.
  description:
    - >-
      The node seeds Lua's random generator with Seed and writes Array length entries. The first
      value of each entry is drawn uniformly between Min 1 and Max 1, the second between Min 2 and
      Max 2 and the third between Min 3 and Max 3. The same Seed gives the same output.
    - >-
      Pack To selects how many of the three ranges are used: X uses range 1, XY uses ranges 1 and 2,
      and XYZ uses all three. With the defaults (Array length 1, XY, every range -1 to 1) the node
      outputs one entry with two values. Ranges that are not used are ignored.
    - >-
      Array length can be 0, which gives an empty array. Show Input adds a connection point to the
      Array length control so that the length can be driven from another node.
    - Use vArrayRandom when one range is enough for every value.
  features:
    - title: No input needed
      desc: The node generates its values from its own controls.
    - title: Range per axis
      desc: X, Y and Z each have their own minimum and maximum.
    - title: Repeatable output
      desc: Seed fixes the sequence, so the same settings give the same values.
    - title: Optional length input
      desc: Show Input exposes a connection point for Array length.
  connections:
    - label: Draw random points
      lines:
        - vArrayMinMax.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the points before drawing
      lines:
        - vArrayMinMax.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Beginner
  related:
    - name: vArrayRandom
      desc: Draws every value from one shared range.
    - name: vArrayNoise
      desc: Generates random points in a cube, with optional animated motion.
    - name: vArrayCreateRange
      desc: Creates a range of values as an array.
  params:
    arrayLength: Number of entries in the output. Minimum 0, default 1.
    Seed: Seed of the random generator. Default 0.
    Packto: Number of values in each entry, X, XY or XYZ. Default XY.
    ShowInput: Shows or hides a connection point on the Array length control. Default off.
    'ModeSelect ': 'Options: X, XY, XYZ.'
    Min1: Lower limit of the first value in each entry. Default -1.
    Max1: Upper limit of the first value in each entry. Default 1.
    Min2: Lower limit of the second value in each entry. Default -1.
    Max2: Upper limit of the second value in each entry. Default 1.
    Min3: Lower limit of the third value in each entry. Default -1.
    Max3: Upper limit of the third value in each entry. Default 1.
status:
