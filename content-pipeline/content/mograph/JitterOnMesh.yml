operation: JitterOnMesh
tools:
  Array: vArrayJitterOnMesh
  ScriptVal: vScriptValJitterOnMesh
  JSON: vJSONJitterOnMesh
legacy_names: []
curated:
  tagline: Jumps each point randomly in the local tangent plane, then snaps it to the closest mesh vertex.
  overview: >-
    vArrayJitterOnMesh takes an array of XYZ points and a mesh. Each point is moved by a random
    distance up to Jitter Radius in the tangent plane at the nearest mesh vertex, then replaced by
    the closest mesh vertex to that position.
  description:
    - >-
      For each point the node finds the closest mesh point and builds two tangent directions from
      the normal there. It picks a random angle and a distance up to Jitter Radius (spread evenly
      over the disk), moves the point there and takes the closest mesh point to the result. Surface
      Offset moves it along its normal.
    - >-
      Without Mesh Faces the mesh points are the vertices, so the output points are vertices and a
      small Jitter Radius on a coarse mesh often returns the same one. With Mesh Faces connected the
      result is the closest point on the triangles, with the face normal.
    - >-
      The random values come from a hash of the point number and Random Seed (default 0), so the
      same Seed, points and mesh give the same result. With Animate Jitter on, the seed also changes
      by 12345 per whole step of render time times Animation Speed. Affect X, Y and Z keep unchecked
      axes.
  features:
    - title: Snaps to the mesh
      desc: >-
        The jittered position is replaced by the closest vertex, or the closest triangle point with
        Mesh Faces.
    - title: Repeatable
      desc: The same Seed gives the same result.
    - title: Stepped animation
      desc: Animate Jitter changes the seed as render time advances.
    - title: Surface Offset
      desc: The result can be lifted off the mesh along its normal.
  connections:
    - label: Jitter a grid on a loaded mesh and draw
      lines:
        - vArrayPointsOnGrid.Output -> vArrayJitterOnMesh.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayJitterOnMesh.MeshPoints
        - vArrayJitterOnMesh.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Jitter scattered points
      lines:
        - vArrayScatterOnMesh.Output -> vArrayJitterOnMesh.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayJitterOnMesh.MeshPoints
        - vArrayJitterOnMesh.Output -> vArrayTranslate.Input
  difficulty: Advanced
  related:
    - name: vArrayPointsJitter
      desc: Adds jitter to the points of an Array in 3D.
    - name: vArraySlideOnMesh
      desc: Slides input points in a world-space direction, then reprojects them onto the mesh.
    - name: vArrayRelaxOnMesh
      desc: Iteratively relaxes scattered points toward an even distribution on the mesh surface.
  params:
    jitterradius: >-
      Largest distance of the random move in the tangent plane, before the snap to a vertex. Minimum
      0, slider 0 to 1, default 0.05.
    seed: Integer from 0, slider to 100000, default 0.
    animatejitter: Changes the seed with the render time when on. Default off.
    animationspeed: Multiplies the render time for the seed steps. Minimum 0, slider 0 to 10, default 1.
    surfaceoffset: Distance from the vertex along its estimated normal. Slider -1 to 1, default 0.
    inaffectx: X comes from the result when checked (default), otherwise it keeps the input value.
    inaffecty: Y comes from the result when checked (default), otherwise it keeps the input value.
    inaffectz: Z comes from the result when checked (default), otherwise it keeps the input value.
    MeshFaces: >-
      Optional. Face index lists of the mesh, from the Edges output of vArrayFromOBJ. Not connected:
      the result snaps to the closest vertex. Connected: it snaps to the closest point on the
      triangles.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    Random values come from a local hash of the point index and Seed since fix batch F5, no longer
    from math.randomseed. Numbers per Seed differ from older comps.
