operation: TangentVector
tools:
  Array: vArrayTangentVector
  ScriptVal: vScriptValTangentVector
  JSON: vJSONTangentVector
legacy_names: []
curated:
  tagline: Builds a tangent vector at each path point and outputs the start, end or flipped end points.
  overview: >-
    vArrayTangentVector takes an array of XYZ path points and outputs, for each point, one end of a
    tangent line: the point itself (Start), the point plus the tangent (End), or the point minus the
    tangent (flipped).
  description:
    - >-
      The tangent at a point is the direction to the next point in X, Y and Z, made unit length and
      multiplied by Scale Factor. The last point reuses the direction of the last segment. Rotate
      Angle then rotates the vector around the Z axis by that many degrees.
    - >-
      Mode picks the output: Start gives the path points unchanged, End gives the point plus the
      vector, and flipped gives the point minus the vector. With Scale Factor 0 all three are the
      same. Scale Factor runs from 0 to 1 and defaults to 1. The path needs at least 2 points with
      exactly 3 numbers each.
  features:
    - title: Three outputs
      desc: Start, End and flipped points give the two ends of a tangent line.
    - title: Scale Factor
      desc: The vector length is the Scale Factor, from 0 to 1.
    - title: Rotation
      desc: Rotate Angle turns every vector around Z in degrees.
    - title: Path order kept
      desc: The output has one point per path point, in path order.
  connections:
    - label: Draw tangents on an arc
      lines:
        - vArrayPointsOnArc.Output -> vArrayTangentVector.ArrayPath
        - vArrayTangentVector.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Tangent end points of a spiral
      lines:
        - vArrayLogarithmicSpiral.Output -> vArrayTangentVector.ArrayPath
        - vArrayTangentVector.Output -> vArrayTranslate.Input
  difficulty: Intermediate
  related:
    - name: vArrayTangentVectorItem
      desc: Creates a vector that is tangent to a curve or surface at a given point.
    - name: vArrayPathFrame
      desc: Builds tangent, normal and binormal frames along a path.
    - name: vArrayLookAt
      desc: Builds per-point look-at direction vectors.
  params:
    mode: >-
      Start (default), End or flipped. Start gives the path points, End adds the vector and flipped
      subtracts it.
    angle: Rotation of each vector around Z in degrees. Integer, slider 0 to 360, default 0.
    scaleFactor: Length of the vector. Range 0 to 1, default 1.
    ArrayPath: Path points, in order.
    ScriptVal1: ScriptVal family. Path points, in order.
    JSONPath: JSON family. Path points, in order.
status:
  source: ai
  state: ai
  reviewed_hash: null
  connections_source: docsify
  prompt_version: '1'
  note: >-
    Changed in fix batch F1 (branch fix/findings-f1 of vonk-ultra-mograph), same change in all three
    families. The Z part of the direction was always 0; it is now the Z difference to the next
    point, so paths that change in Z get 3D tangents. The control "Max angle" was renamed "Rotate
    Angle" (ID angle): it rotates every tangent vector around Z by that many degrees and is not a
    limit on the angle between segments. Scale Factor defaulted to 0, which made every vector zero
    length; it now defaults to 1. Each path point must have exactly 3 numbers and the path at least
    2 points, otherwise the node raises an error.
legacy_text: Create a vector that is tangent to a curve or surface at a given point
