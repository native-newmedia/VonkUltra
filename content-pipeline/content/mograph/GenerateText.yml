operation: GenerateText
tools:
  Array: vArrayGenerateText
  ScriptVal: vScriptValGenerateText
  JSON: vJSONGenerateText
legacy_names: []
curated:
  tagline: >-
    Generate an array of random text items, such as words, names, numbers, colors or lorem ipsum,
    from a seed.
  overview: >-
    vArrayGenerateText outputs an array of text strings. Generate Random picks the kind of text,
    Array length sets how many items are made, and Seed makes the result repeatable. Lorem ipsum
    mode builds text of a chosen length instead.
  description:
    - >-
      The node seeds a random generator with Seed and writes Array length items of the chosen kind.
      The kinds are None, Pick from input array, Lorem ipsum, Bool, Character, Word, Letter, Vowel,
      Hash, three integer types, rgb, rgba, hsl and hsla colors, ip, ipv4 and ipv6 addresses, Phone,
      Address, Street, String, Syllable, Shuffle and six name types: Name, Male name, Male name
      w/last, Name w/last, Female name and Female name w/last. Pick from input array chooses an item
      of the connected array for each output item.
    - >-
      Lorem ipsum, the default, ignores Array length and Seed and uses Select Mode: characters,
      words, sentences or paragraphs, with the matching count control. Item n has n units, up to
      that count. Select Mode none, the default, gives an empty array. Letter Case then converts
      every item to upper or lower case.
  features:
    - title: No input needed
      desc: Most kinds of text are generated without any connection.
    - title: Many kinds of text
      desc: Names, words, numbers, colors, network addresses and lorem ipsum are available.
    - title: Repeatable output
      desc: Seed fixes the random generator, so the same settings give the same items.
    - title: Case control
      desc: Letter Case converts the items to upper or lower case.
  connections:
    - label: Pick random items from a list
      lines:
        - vArrayRandom.Output -> vArrayGenerateText.Text
    - label: Generate text and write it as XYZ text
      lines:
        - vArrayGenerateText.OutputValData -> vArrayToXYZ.ArrayA
  difficulty: Intermediate
  related:
    - name: vArrayTextFont
      desc: Creates glyph outlines from text and a font.
    - name: vArrayCreateFont
      desc: Creates a font asset for text outlines.
    - name: vArrayRandom
      desc: Creates random values between a low and a high limit.
  params:
    chanceOperation: >-
      Kind of text to generate. Male name, Male name w/last and Name w/last give a male first name,
      a male first and last name, and a first and last name. Default Lorem ipsum.
    arrayLength: Number of items to generate. Hidden in Lorem ipsum mode. Minimum 0, default 1.
    seed: Seed of the random generator. Hidden in Lorem ipsum mode. Default 0.
    selectMode: >-
      Used by Lorem ipsum. Chooses characters, words, sentences or paragraphs, or none. Default
      none.
    CharacterCount: >-
      Used by Lorem ipsum with Characters. Number of items, and length in characters of the longest.
      Minimum 0, default 10.
    WordCount: >-
      Used by Lorem ipsum with Words. Number of items, and length in words of the longest. Minimum
      0, default 5.
    sentenceCount: >-
      Used by Lorem ipsum with Sentences. Number of items, and length in sentences of the longest.
      Minimum 0, default 1.
    paragraphCount: >-
      Used by Lorem ipsum with Paragraphs. Number of items, and length in paragraphs of the longest.
      Minimum 0, default 1.
    Case: Letter Case of every item, NONE, UPPER or LOWER. Default NONE.
    ScriptValtext: Array of text items that Pick from input array chooses from.
status:
  source: ai
  state: ai
  reviewed_hash: null
  connections_source: docsify
  prompt_version: '1'
  note: >-
    Rewritten against the fuse after fix batch F3 (branch fix/findings-f3 of vonk-ultra-mograph). In
    the Generate Random menu the entries Male name, Male name w/last and Name w/last called the
    generators in a different order (Name w/last, Male name, Male name w/last). The code now follows
    the labels. Nothing was run in Fusion.
legacy_text: >-
  Example, generating random Text and Strings The following Generate Random options are available: -
  Pick from → input Array - Lorem ipsum Basics: - Bool - Character - Word - Letter - Vowel Names: -
  Name - Male name - Male name w/last - Name w/last - Female name - Female name w/last Numbers: -
  Hash - Integer - Integer w/min - Integer w/both Color: - rgb - rgba - hsl - hsla Tech: - ip - ipv4
  - ipv6 Location: - Phone - Address - Street Strings: - String - Syllable - Shuffle Lorem ipsum
  Node Connections: vArrayGenerateText.chanceOperation = "Lorem ipsum" vArrayGenerateText.selectMode
  = "Paragraph" vArrayGenerateText.paragraphCount = 8 Name Node Connections:
  vArrayGenerateText.chanceOperation = "Name" vArrayGenerateText.arrayLength = 1 Female name with
  last name Node Connections: vArrayGenerateText.chanceOperation = "Female name w/last"
  vArrayGenerateText.arrayLength = 1 RGB Color Node Connections: vArrayGenerateText.chanceOperation
  = "rgb" vArrayGenerateText.arrayLength = 12 IPv4 Node Connections:
  vArrayGenerateText.chanceOperation = "ipv4" vArrayGenerateText.arrayLength = 1
