operation: PointsOnSphere
tools:
  Array: vArrayPointsOnSphere
  ScriptVal: vScriptValPointsOnSphere
  JSON: vJSONPointsOnSphere
legacy_names: []
curated:
  tagline: >-
    Generate points on a sphere with a Fibonacci spiral layout or a random layout with three
    distributions.
  overview: >-
    vArrayPointsOnSphere has no input and outputs an array of XYZ points around the origin. Create
    chooses between a Fibonacci sphere and a random Custom sphere, and the controls shown change
    with the choice.
  description:
    - >-
      In Fibonacci Sphere mode, point i of n has Y = 1 - 2 * i / (n - 1), a horizontal radius of
      sqrt(1 - Y * Y) and the angle i * pi * (sqrt(5) - 1) around the Y axis, with X = cos(angle) *
      radius and Z = sin(angle) * radius. All three values are multiplied by Sphere size. The points
      follow a spiral from the top of the sphere, Y = +1, to the bottom.
    - >-
      Trim Top and Trim Bottom clamp the unscaled Y value. The value of the Trim Top control is the
      lower limit and the value of the Trim Bottom control is the upper limit, so the labels are the
      reverse of the Y direction. The defaults of -1 and 1 do not change anything. A point outside
      the limits keeps its X and Z and gets Y set to the limit, so it is flattened onto a plane and
      not removed. Setting Random Distance to True writes a second point on the same ray for every
      point, at a random distance between 0 and Sphere size. Random seed seeds the random generator,
      and in this mode the control is hidden.
    - >-
      In Custom Sphere mode the node writes Amount of points points at random positions. Each point
      starts at (Sphere size, 0, 0), or at (-Sphere size, 0, 0) for every second point, minus a
      random amount up to Random distance, and is rotated by a random rotation. Distribution picks
      how the random numbers for the rotation are drawn. Uniform draws from -1 to 1, while Poles and
      Half draw from 0 to 1, which concentrates the points. In Half every point starts at +Sphere
      size. The result is multiplied by the hidden Scale Factor. Random seed makes the layout
      repeatable.
    - >-
      With the defaults (Fibonacci Sphere, 100 points, Sphere size 0.3) the node outputs 100 points
      on a sphere of radius 0.3. Amount of points has a minimum of 2. The hidden Rotate Factor
      control is not used.
  features:
    - title: No input needed
      desc: The node generates its points from its own controls.
    - title: Two layouts
      desc: Fibonacci Sphere is deterministic and Custom Sphere is random with a seed.
    - title: Trim by clamping Y
      desc: Trim Top and Trim Bottom flatten points that fall outside a Y range.
    - title: Random distance option
      desc: Points can be pulled inward or doubled at random distances from the center.
  connections:
    - label: Draw the sphere points
      lines:
        - vArrayPointsOnSphere.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the points before drawing
      lines:
        - vArrayPointsOnSphere.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Intermediate
  related:
    - name: vArrayGeodesicSphere
      desc: Generates the vertices of an icosphere.
    - name: vArrayGenerateSphere
      desc: Generates latitude and longitude lines on a sphere.
    - name: vArrayNoise
      desc: Generates random points inside a cube.
  params:
    matcharrays: >-
      Chooses the Fibonacci Sphere or the Custom Sphere layout. Changing it shows the controls of
      that layout. Default Fibonacci Sphere.
    Amountofpoints: Number of points. Minimum 2, default 100.
    Spheresize: Radius of the sphere. Default 0.3.
    randomDistance: >-
      Fibonacci Sphere only. True adds a second point at a random distance for every point. Default
      False.
    Randomdseed: >-
      Custom Sphere uses it to seed the random layout. Hidden in Fibonacci mode, where it still
      seeds the random distances. Default 0.
    Distribution: >-
      Custom Sphere only. Uniform, Poles or Half. Controls how the random rotation is drawn. Default
      Uniform.
    trimTop: Fibonacci Sphere only. Lower limit for Y before scaling. Range -1 to 1, default -1.
    trimbottom: Fibonacci Sphere only. Upper limit for Y before scaling. Range -1 to 1, default 1.
    Randomdistance: >-
      Custom Sphere only, hidden in Fibonacci mode. Random amount up to this value that is taken off
      the start distance of each point. Default 0.
    trimBottom: Removes the bottom part of the sphere.
    scaleFactor: Hidden control. Multiplier applied to all points in Custom Sphere mode. Default 1.
    rotFactor: Hidden control. It is not used in the calculation. Default 0.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The controls labelled Trim Top and Trim Bottom feed the lower and upper Y limit respectively, so
    the labels are the reverse of the Y direction. Hidden Rotate Factor is not used. Fuse logic was
    not changed.
legacy_text: Generate points on Sphere
