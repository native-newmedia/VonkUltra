operation: PointsOnSphere
tools:
  Array: vArrayPointsOnSphere
  ScriptVal: vScriptValPointsOnSphere
  JSON: vJSONPointsOnSphere
legacy_names: []
curated:
  tagline: >-
    Distribute points evenly across a sphere — Fibonacci, random, or trimmed to a hemisphere for 3D
    scatter and globe visualisations.
  overview: >-
    vArrayPointsOnSphere generates a vArray of XYZ coordinates distributed across the surface of a
    sphere. Choose from multiple distribution algorithms and trim the poles to create hemispheres or
    bands.
  description:
    - >-
      vArrayPointsOnSphere is the primary 3D scatter generator in the vArray toolkit. It computes
      point positions on the surface of a sphere using a selectable distribution method — Fibonacci
      spiral for even spacing, or random for organic variation — then outputs a vArray ready for
      vArrayCameraProjection and vArrayShapeRender.
    - >-
      The Distribution dropdown controls how points are placed on the surface. Fibonacci spiral
      distribution produces the most visually even coverage and is the preferred mode for data
      visualisations such as globe plots. Random distribution with a fixed seed gives repeatable
      organic layouts. Adjust Random distance to add radial jitter, pushing points off the surface
      for volumetric effects.
    - >-
      Trim Top and Trim Bottom clip the sphere along the Y axis, producing hemispheres, rings, or
      bands between any two latitude values (–1 to 1). This is particularly useful when the camera
      angle only sees part of the sphere, or when creating planet visualisations where the poles
      need to be hidden. Connect the output to vArrayDisplaceValues before rendering to add
      noise-driven surface variation.
    - >-
      Amount of points scales from 2 to tens of thousands — keep it under 2000 for real-time
      feedback in Fusion's viewer. Sphere size sets the radius in Fusion's normalised coordinate
      space (default 0.3 ≈ roughly fills a 1920×1080 frame when centred).
  features:
    - title: Multiple Distribution Modes
      desc: >-
        Fibonacci spiral delivers evenly spaced coverage ideal for data vis; random mode with a
        fixed seed gives repeatable organic scatter.
    - title: Pole Trimming
      desc: >-
        Trim Top and Trim Bottom clip the sphere at any latitude, generating hemispheres, equatorial
        bands, or any partial sphere shape.
    - title: Radial Jitter
      desc: >-
        Random distance parameter pushes points off the surface for volumetric cloud effects without
        needing a separate displacement node.
    - title: Scalable Point Count
      desc: >-
        Generate from 2 to tens of thousands of points — scales from quick layout sketches to dense
        globe visualisations.
  connections:
    - label: Standard 3D scatter pipeline
      lines:
        - vArrayPointsOnSphere.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: With noise displacement
      lines:
        - vArrayPointsOnSphere.Output -> vArrayDisplaceValues.ArrayA
        - vArrayDisplaceValues.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
  difficulty: Intermediate
  related:
    - name: vArrayPointsOnCircle
      desc: 2D ring generator — use for equatorial cross-sections of a sphere.
    - name: vArrayDisplaceValues
      desc: Add noise-driven displacement to the sphere surface points.
    - name: vArrayCameraProjection
      desc: Projects 3D sphere coordinates to 2D screen space for rendering.
  params:
    matcharrays: >-
      Internal creation mode flag. Controls whether the node regenerates the array on each parameter
      change.
    Amountofpoints: >-
      Total number of points to distribute on the sphere surface. Higher values produce denser
      coverage.
    Spheresize: >-
      Radius of the sphere in Fusion's normalised coordinate space. Default 0.3 roughly fills a
      standard 1920×1080 frame when centred.
    randomDistance: >-
      Magnitude of the radial offset when Random distance mode is active. Scales how far points are
      pushed away from the sphere surface.
    Randomdseed: >-
      Seed value for the random number generator. Change to get different random layouts while
      keeping the same point count.
    Distribution: >-
      Selects the point distribution algorithm: Fibonacci spiral (even coverage) or random
      placement.
    trimTop: >-
      Upper latitude clipping value (–1 to 1). –1 = no trimming at the top pole. Increase to cut off
      the upper cap.
    trimbottom: >-
      Lower latitude clipping value (–1 to 1). 1 = no trimming at the bottom pole. Decrease to cut
      off the lower cap.
    Randomdistance: Amount of random displacement.
    trimBottom: Removes the bottom part of the sphere.
status:
  source: rich-json
  state: imported
  reviewed_hash: null
