operation: SlideOnMesh
tools:
  Array: vArraySlideOnMesh
  ScriptVal: vScriptValSlideOnMesh
  JSON: vJSONSlideOnMesh
legacy_names: []
curated:
  tagline: Moves each point in a direction, then snaps it to the closest mesh vertex.
  overview: >-
    vArraySlideOnMesh takes an array of XYZ points and a mesh. Each point is moved by Slide Distance
    along Direction X, Y and Z, and the result is replaced by the closest mesh vertex.
  description:
    - >-
      The direction is made unit length. A direction of 0, 0, 0, the default, becomes 0, 0, 1. Each
      point is moved by Slide Distance (default 0.1, slider -10 to 10) along it, and the node then
      finds the closest mesh point to the moved position. The output is that mesh point plus Surface
      Offset along the normal there.
    - >-
      Without Mesh Faces the mesh points are the vertices, so the output points are always mesh
      vertices. With Mesh Faces connected the closest point is on the triangles and the normal is
      the face normal, so the result can lie inside a face. Affect X, Y and Z keep unchecked axes at
      their input value. If the mesh or the points are empty, the points are output unchanged.
  features:
    - title: Directional slide
      desc: Points move along a fixed direction by Slide Distance before the snap.
    - title: Snap to the mesh
      desc: The moved position is replaced by the closest vertex, or triangle point with Mesh Faces.
    - title: Surface Offset
      desc: The result can be lifted off the mesh along its normal.
    - title: Pass-through without mesh
      desc: Without mesh data the points are output unchanged.
  connections:
    - label: Slide a grid over a loaded mesh and draw
      lines:
        - vArrayPointsOnGrid.Output -> vArraySlideOnMesh.ArrayPoints
        - vArrayFromOBJ.Points -> vArraySlideOnMesh.MeshPoints
        - vArraySlideOnMesh.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Slide scattered points
      lines:
        - vArrayRandom.Output -> vArraySlideOnMesh.ArrayPoints
        - vArrayFromOBJ.Points -> vArraySlideOnMesh.MeshPoints
        - vArraySlideOnMesh.Output -> vArrayTranslate.Input
  difficulty: Advanced
  related:
    - name: vArrayJitterOnMesh
      desc: Jitters input points in the mesh tangent plane, then reprojects them onto the mesh.
    - name: vArrayProjectOnMesh
      desc: Projects input points onto the nearest mesh surface point.
    - name: vArraySnapMeshVertex
      desc: Snaps each input point to the nearest mesh vertex.
  params:
    DirX: X of the slide direction. Default 0.
    DirY: Y of the slide direction. Default 0.
    DirZ: Z of the slide direction. Default 0. A direction of 0, 0, 0 is treated as 0, 0, 1.
    slidedistance: Distance of the move along the direction. Slider -10 to 10, default 0.1.
    surfaceoffset: Distance from the vertex along its estimated normal. Slider -1 to 1, default 0.
    inaffectx: X comes from the result when checked (default), otherwise it keeps the input value.
    inaffecty: Y comes from the result when checked (default), otherwise it keeps the input value.
    inaffectz: Z comes from the result when checked (default), otherwise it keeps the input value.
    MeshFaces: >-
      Optional. Face index lists of the mesh, from the Edges output of vArrayFromOBJ. Not connected:
      the moved position snaps to the closest vertex. Connected: to the closest point on the
      triangles.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The default direction 0, 0, 0 has no length, and the code turns it into 0, 0, 1, so the default
    slides the points by +0.1 on Z. The slid position is replaced by the closest mesh vertex, so the
    output points are mesh vertices (plus Surface Offset along their estimated normal). With no mesh
    data the points are output unchanged (3 values). Since fix batch F5 the node has an optional
    Mesh Faces input (Edges output of vArrayFromOBJ); the text describes the node with and without
    it.
