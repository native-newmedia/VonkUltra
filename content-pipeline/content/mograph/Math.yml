operation: Math
tools:
  Array: vArrayMath
  ScriptVal: vScriptValMath
  JSON: vJSONMath
legacy_names: []
curated:
  tagline: Applies one of 31 math operations to every X, Y and Z value, with a number or a second array.
  overview: >-
    vArrayMath reads each element of Input A as X, Y and Z and combines it with a number or with the
    matching element of Input B. Operation chooses the formula, and the output has three values per
    element.
  description:
    - >-
      Each element of Input A is read as X, Y and Z (a single number is used for all three) and the
      operation runs on each axis against B. B is the Number control (default 1) in Use Number mode,
      or the matching element of Input B in Use Array mode, with 0 for missing entries.
    - >-
      Operation offers 31 choices: arithmetic, min, max, modulo, power, trigonometry, logs,
      rounding, reciprocal and random values. Divide, Modulo, Log, Square Root and Reciprocal return
      0 where they are undefined. Matrix Multiply multiplies a translation made from each element by
      a matrix from Input B and outputs the resulting position.
    - >-
      Some labels differ from the formula. Arc Sine, Arc Cosine and Arc Tangent compute sinh, cosh
      and tanh. Negate computes 1 - A.
  features:
    - title: 31 operations
      desc: >-
        Arithmetic, comparison, trigonometry, logarithms, rounding, random values and Matrix
        Multiply.
    - title: Number or array operand
      desc: Input Number selects a fixed number or a second array.
    - title: Axis by axis
      desc: Each of X, Y and Z is calculated on its own.
    - title: Status label
      desc: A label at the top shows whether Input B is connected and in use.
  connections:
    - label: Scale displacement amounts
      lines:
        - vArrayRandom.Output -> vArrayMath.ArrayA
        - vArrayMath.Output -> vArrayDisplaceValues.ArrayA
        - vArrayDisplaceValues.Output -> vArrayCameraProjection.ArrayA
    - label: Add two arrays
      lines:
        - vArrayPointsOnGrid.Output -> vArrayMath.ArrayA
        - vArrayRandom.Output -> vArrayMath.ArrayB
        - vArrayMath.Output -> vArrayTranslate.Input
  difficulty: Intermediate
  related:
    - name: vArrayMapRange
      desc: Applies range mapping operations to an Array.
    - name: vArraySin
      desc: Applies sine and cosine operations to an Array.
    - name: vArrayClamp
      desc: Clamps numeric values in nested arrays and tables.
  params:
    Which: Hidden control. Range 1 to 64. Not read by the code.
    Operation: >-
      One of 31 operations, default Add: Add, Subtract A-B, Multiply, Divide A/B, Min, Max, Average,
      Difference, Modulo A/B, Power A^B, Arc Tangent A/B, Pi, Sine, Cosine, Tangent, Arc Sine, Arc
      Cosine, Arc Tangent, Log, Log 10, Exponential, Degrees to Radians, Radians to Degrees,
      Absolute Value, Ceiling, Floor, Square Root, Reciprocal, Negate, Random, Randomseed and Matrix
      Multiply.
    InputNumber: Use Number (default) uses the Number control as B. Use Array uses Input B and shows its port.
    opNumber: The B value in Use Number mode, used on all three axes. Slider -1 to 1, default 1.
    ConnectInputCallback: Set to 1 automatically when Input B is connected, otherwise 0. Not meant to be edited.
    ArrayA: Values to process.
    ArrayB: Second operand in Use Array mode, matched by index. For Matrix Multiply, the matrix text.
    Matrix: ScriptVal family. Matrix input used by Matrix Multiply.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    Several Operation labels do not match the formula. Arc Sine, Arc Cosine and Arc Tangent compute
    sinh, cosh and tanh. Negate computes 1 - A. Randomseed does not seed anything: it returns a
    random value between A and B. Random returns A times a random value from 0 to 1. The old text
    lists only six operations. The old text says Which selects an element; the control is hidden and
    Process() never reads it. Array B does not have to match the length of Array A; missing entries
    count as 0. The output always has three values per element. In the ScriptVal fuse the matrix for
    Matrix Multiply comes from a separate Matrix input and not from Input B.
legacy_text: >-
  Math Operations on an Array Tip: If you want to apply math operations to arrays of XY or XYZ value
  pairs, the vArrayUnPacker node will extract all the values into a single linear sequence of
  numbers. You can then use the vArrayMath node to modify the values. Then a vArrayPacker node can
  remux the linear sequence of numbers back into XY or XYZ value pairs. The following math
  operations are supported: - Subtract A-B - Multiply - Divide A/B - Min - Max - Average -
  Difference - Modulo A/B - Power A^B - Arc Tangent A/B - Sine - Cosine - Tangent - Arc Sine - Arc
  Cosine - Arc Tangent - Log - Log 10 - Exponential - Degrees to Radians - Radians to Degrees -
  Absolute Value - Ceiling - Floor - Square Root - Reciprocal - Negate - Random - Randomseed -
  Matrix Multiply Tip: A Vonk vMatrix transform can be applied to an array when the "Operation"
  control is set to "Matrix Multiply", and the "Input Number" is set to "Use Array". The ideal
  vMatrix node to use for this application is the "vMatrixCreateTRS" node that combines translation,
  rotation, and scale. Matrix Multiply Node Connections:
