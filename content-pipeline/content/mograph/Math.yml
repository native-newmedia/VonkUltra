operation: Math
tools:
  Array: vArrayMath
  ScriptVal: vScriptValMath
  JSON: vJSONMath
legacy_names: []
curated:
  tagline: >-
    Apply add, subtract, multiply, or divide to every element in a vArray — the essential arithmetic
    node for data-driven motion.
  overview: >-
    vArrayMath applies a scalar or per-element arithmetic operation to a vArray. Place it anywhere
    in the pipeline to scale, offset, or combine numeric arrays before passing them to renderers or
    downstream modifiers.
  description:
    - >-
      vArrayMath is the go-to arithmetic node in the vArray toolkit. Connect Array A (and optionally
      Array B), select your operation from the dropdown — Add, Subtract, Multiply, Divide, Power,
      Modulo, and more — and every element in the array is transformed in a single pass. The result
      feeds directly into any downstream vArray node.
    - >-
      The Which parameter targets a specific element index (1–64) when you only want to modify part
      of the array rather than applying the operation globally. Toggle Show Input to expose Array B
      for per-element operations between two arrays, or leave it off to use the static Number value
      as the operand.
    - >-
      Use vArrayMath to normalise ranges after vArrayMapRange, to scale displacement magnitudes
      before vArrayDisplaceValues, or to combine two numeric datasets from separate vArrayCreate
      nodes. Its minimal interface keeps the node graph clean while handling the arithmetic layer
      that almost every intermediate workflow requires.
  features:
    - title: Full Arithmetic Set
      desc: >-
        Add, Subtract, Multiply, Divide, Power, and Modulo operations cover every scalar transform
        needed in data-driven pipelines.
    - title: Dual-Array Mode
      desc: >-
        Enable Array B input for per-element operations between two arrays — blend two datasets,
        compute differences, or multiply component-wise.
    - title: Element Targeting
      desc: >-
        Which parameter (1–64) lets you apply the operation to a single index within the array
        without affecting the rest of the data.
    - title: Pipeline Utility
      desc: >-
        Sits cleanly between any generator and modifier node — normalise, scale, or offset data in
        one step before it reaches the renderer.
  connections:
    - label: Scale displacement magnitude
      lines:
        - vArrayCreateMinMax.Output -> vArrayMath.ArrayA
        - vArrayMath.Output -> vArrayDisplaceValues.ArrayA
        - vArrayDisplaceValues.Output -> vArrayCameraProjection.ArrayA
    - label: Combine two data sources
      lines:
        - vArrayCreate.Output -> vArrayMath.ArrayA
        - vArrayCreateRandom.Output -> vArrayMath.ArrayB
        - vArrayMath.Output -> vArrayShapeRender.ArrayPoint
  difficulty: Beginner
  related:
    - name: vArrayMapRange
      desc: Remap array values between input and output ranges before or after arithmetic operations.
    - name: vArrayDisplaceValues
      desc: Apply noise-based displacement — use vArrayMath to scale the displacement magnitude first.
    - name: vArrayCreate
      desc: Generate the numeric arrays that vArrayMath operates on.
  params:
    Which: >-
      Selects which element index (1–64) the operation targets. Useful when modifying a single value
      within the array rather than every element.
    Operation: 'Selects the arithmetic operation to apply: Add, Subtract, Multiply, Divide, Power, or Modulo.'
    InputNumber: >-
      Toggles the secondary Array B input port. Set to 1 to expose Array B for per-element
      operations between two arrays.
    opNumber: >-
      The scalar operand used when Array B is not connected. For Multiply, 1 = no change; for Add, 0
      = no change.
    ConnectInputCallback: >-
      Internal state flag indicating whether Array B is currently connected. Read-only in normal
      use.
    ArrayA: Primary vArray input. All elements in this array are processed by the selected operation.
    ArrayB: >-
      Optional secondary vArray input for per-element operations. Must be the same length as Array
      A.
status:
  source: rich-json
  state: imported
  reviewed_hash: null
legacy_text: >-
  Math Operations on an Array Tip: If you want to apply math operations to arrays of XY or XYZ value
  pairs, the vArrayUnPacker node will extract all the values into a single linear sequence of
  numbers. You can then use the vArrayMath node to modify the values. Then a vArrayPacker node can
  remux the linear sequence of numbers back into XY or XYZ value pairs. The following math
  operations are supported: - Subtract A-B - Multiply - Divide A/B - Min - Max - Average -
  Difference - Modulo A/B - Power A^B - Arc Tangent A/B - Sine - Cosine - Tangent - Arc Sine - Arc
  Cosine - Arc Tangent - Log - Log 10 - Exponential - Degrees to Radians - Radians to Degrees -
  Absolute Value - Ceiling - Floor - Square Root - Reciprocal - Negate - Random - Randomseed -
  Matrix Multiply Tip: A Vonk vMatrix transform can be applied to an array when the "Operation"
  control is set to "Matrix Multiply", and the "Input Number" is set to "Use Array". The ideal
  vMatrix node to use for this application is the "vMatrixCreateTRS" node that combines translation,
  rotation, and scale. Matrix Multiply Node Connections:
