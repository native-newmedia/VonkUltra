operation: FromPolylineMulti
tools:
  Array: vArrayFromPolylineMulti
  ScriptVal: vScriptValFromPolylineMulti
  JSON: vJSONFromPolylineMulti
legacy_names: []
curated:
  tagline: >-
    Sample up to eight paths drawn in the viewer into one point list, with a group size for each
    path.
  overview: >-
    vArrayFromPolylineMulti outputs one array of XYZ points that holds the sampled points of up to
    eight drawn paths, and a Groups output with the number of points taken from each path.
  description:
    - >-
      Path Count sets how many of the eight path controls are shown and used. Each path is sampled
      at equal fractions of its length, with the global Point Count and Closed Loop, and the points
      of all paths are joined in path order. Without Closed Loop the first and last points of a path
      are at its ends. With it on, the spacing is divided by the count instead of the count - 1 and
      the first point is not repeated.
    - >-
      Every path has its own Reset Path button and an Override Count checkbox. When Override Count
      is on, the path uses its own Count and Closed values instead of the global ones. These
      per-path controls are built in a loop and are not listed in the parameter table.
    - >-
      After sampling, Flip X and Flip Y negate the values, Aspect Correct divides Y by 16 / 9, and
      Scale X and Scale Y multiply the values. Z is always 0. A path with fewer than two points adds
      nothing and does not appear in the groups.
    - >-
      The Groups output lists the number of points added by each path, in order. The node also
      creates an image filled with Canvas R, G and B so the paths can be drawn in the viewer. The
      image does not change the point output.
  features:
    - title: Up to eight paths
      desc: Path Count shows between one and eight drawable paths.
    - title: Per-path overrides
      desc: Each path can use its own point count and closed setting.
    - title: Groups output
      desc: The Groups socket lists how many points each path contributed.
    - title: Shared corrections
      desc: Flip, aspect and scale settings apply to all paths.
  connections:
    - label: Draw all paths with their groups
      lines:
        - vArrayFromPolylineMulti.Output -> vArrayCameraProjection.ArrayA
        - vArrayFromPolylineMulti.Groups -> vArrayCameraProjection.ArrayGroups
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - vArrayCameraProjection.Groups -> vArrayShapeRender.ArrayGroups
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset all paths before drawing
      lines:
        - vArrayFromPolylineMulti.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Intermediate
  related:
    - name: vArrayFromPolyline
      desc: Samples a single drawn path.
    - name: vArrayFromPolylineBG
      desc: Samples a single path drawn over a background image.
    - name: vArrayFromSpline
      desc: Creates points from a spline.
  params:
    pathCount: Number of path controls that are shown and used. Range 1 to 8, default 2.
    pointCount: Number of points taken from each path, unless the path overrides it. Minimum 2, default 64.
    closedLoop: When on, paths are treated as closed and the first point is not repeated. Default off.
    flipY: Negates Y after sampling. Default on.
    flipX: Negates X after sampling. Default on.
    aspectCorrect: Divides Y by 16 / 9. Default on.
    scaleX: Multiplier applied to X. Minimum 0, default 2.
    scaleY: Multiplier applied to Y. Minimum 0, default 2.
    canvasR: Red level of the image the node creates. Range 0 to 1, default 0.05.
    canvasG: Green level of the image the node creates. Range 0 to 1, default 0.05.
    canvasB: Blue level of the image the node creates. Range 0 to 1, default 0.08.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The per-path controls resetPath_N, override_N, overrideCount_N and overrideClosed_N are built in
    a loop and are not listed as parameters.
