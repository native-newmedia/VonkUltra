operation: OffsetByNormal
tools:
  Array: vArrayOffsetByNormal
  ScriptVal: vScriptValOffsetByNormal
  JSON: vJSONOffsetByNormal
legacy_names: []
curated:
  tagline: Moves each point along the normal estimated at the closest mesh vertex by Offset Distance.
  overview: >-
    vArrayOffsetByNormal takes an array of XYZ points and a mesh, and adds the normal estimated at
    the closest mesh vertex times Offset Distance to each point. Offset Distance is the only value
    that matters, and it defaults to 0.
  description:
    - >-
      For every point the node finds the closest Mesh Points vertex and reads the normal estimated
      there, which is fitted to the 8 nearest vertices and points away from the center of the mesh.
      The output point is the input point plus that normal times Offset Distance, so the point moves
      along the normal from where it is, not from the mesh.
    - >-
      Offset Distance has a slider from -1 to 1 and defaults to 0, which leaves the points where
      they are. A negative value moves the points against the normal. Affect X, Y and Z are checked
      by default, and an unchecked axis keeps its input value.
    - If the points or the mesh are empty, the output is empty.
  features:
    - title: Per-point normals
      desc: Each point uses the normal estimated at its closest mesh vertex.
    - title: Signed distance
      desc: Negative Offset Distance moves points against the normal.
    - title: Per-axis switches
      desc: Affect X, Y and Z restrict the move to the checked axes.
    - title: One control
      desc: Offset Distance is the only value to set.
  connections:
    - label: Push a grid away from a loaded mesh and draw
      lines:
        - vArrayPointsOnGrid.Output -> vArrayOffsetByNormal.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayOffsetByNormal.MeshPoints
        - vArrayOffsetByNormal.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset scattered points
      lines:
        - vArrayScatterOnMesh.Output -> vArrayOffsetByNormal.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayOffsetByNormal.MeshPoints
        - vArrayOffsetByNormal.Output -> vArrayTranslate.Input
  difficulty: Intermediate
  related:
    - name: vArrayAlignToMesh
      desc: Replaces input points with the surface normal of the nearest mesh vertex.
    - name: vArrayProjectOnMesh
      desc: Projects input points onto the nearest mesh surface point.
    - name: vArrayNoiseOnMesh
      desc: Displaces input points with Perlin or fractal noise along the mesh normal or in 3D.
  params:
    inoffsetdistance: Distance along the normal. Slider -1 to 1, default 0.
    inaffectx: X is offset when checked (default), otherwise it keeps the input value.
    inaffecty: Y is offset when checked (default), otherwise it keeps the input value.
    inaffectz: Z is offset when checked (default), otherwise it keeps the input value.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The offset is applied to the original point, not to the closest vertex: the result is the input
    point plus the normal estimated at the closest mesh vertex times Offset Distance. With no mesh
    or no points the output is empty. vmeshutils.buildSurfaceSamples uses only the vertex list of
    Mesh Points. It makes one sample per vertex with all three triangle corners equal to that
    vertex, so every search finds the closest vertex and not a point on a face. The normal of a
    sample is fitted to the 8 nearest vertices and points away from the centroid of all vertices.
    Edges and faces are not read.
