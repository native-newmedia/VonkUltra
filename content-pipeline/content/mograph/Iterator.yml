operation: Iterator
tools:
  Array: vArrayIterator
  ScriptVal: vScriptValIterator
  JSON: vJSONIterator
legacy_names: []
curated:
  tagline: Keeps every Nth point of an array and skips the points in between.
  overview: >-
    vArrayIterator takes an array of XYZ points and outputs points 1, 1 + Step, 1 + 2 * Step and so
    on. Step is the only control, and 1 keeps every point.
  description:
    - >-
      The node walks the input from the first element in steps of Step and copies the first three
      values of each element it lands on. With Step 2 on ten points it keeps points 1, 3, 5, 7 and
      9. With Step 3 it keeps points 1, 4, 7 and 10.
    - >-
      Step is an integer from 1, slider 1 to 10, default 1. At 1 every point is copied. Elements
      that are not lists with at least three values are dropped, so an array of plain numbers gives
      an empty output.
    - >-
      Nothing is repeated or looped. The output has at most the input length divided by Step,
      rounded up, because dropped elements shorten it further.
  features:
    - title: Every Nth point
      desc: Step 1 keeps all points, Step 2 every second one, and so on.
    - title: One control
      desc: Step is the only setting.
    - title: Keeps the first point
      desc: Counting starts at the first element, which is always kept.
    - title: Points only
      desc: Elements without at least three values are dropped.
  connections:
    - label: Thin out a grid and draw it
      lines:
        - vArrayPointsOnGrid.Output -> vArrayIterator.ArrayA
        - vArrayIterator.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Unpack, thin and pack again
      lines:
        - vArrayUnPacker.OutputArray -> vArrayIterator.ArrayA
        - vArrayIterator.Output -> vArrayPacker.ArrayA
  difficulty: Beginner
  related:
    - name: vArrayReducePoints
      desc: Reduces the number of points in an Array.
    - name: vArraySlicer
      desc: Trims the start and end of single or multi-dimensional arrays.
    - name: vArrayAppend
      desc: Repeats an Array a given number of times.
  params:
    _Step: >-
      Take every Nth point, so Step - 1 points are skipped between kept ones. Minimum 1, slider 1 to
      10, default 1.
status:
  source: ai
  state: ai
  reviewed_hash: null
  connections_source: docsify
  prompt_version: '1'
  note: >-
    Changed in fix batch F1 (branch fix/findings-f1 of vonk-ultra-mograph), same change in all three
    families. The registered description said "Loop an array" but the code keeps every Nth element
    of the input (Step = N) and repeats nothing; the description is now "Keep every Nth point of an
    array". Only elements that are lists with at least 3 values are kept, and each is cut to its
    first 3 values.
legacy_text: Loop an array
