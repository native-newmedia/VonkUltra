operation: PointsOnGrid
tools:
  Array: vArrayPointsOnGrid
  ScriptVal: vScriptValPointsOnGrid
  JSON: vJSONPointsOnGrid
legacy_names: []
curated:
  tagline: >-
    Generate a rectangular lattice of points in X, Y and Z with a set count per axis and one spacing
    value.
  overview: >-
    vArrayPointsOnGrid has no input and outputs an array of XYZ points on a regular lattice centered
    on the origin. Number X, Y and Z set the count on each axis, and Multiplier sets the spacing.
  description:
    - >-
      The node writes Number X * Number Y * Number Z points. Point (x, y, z) is placed at X = x *
      Multiplier - offset X, Y = y * Multiplier - offset Y and Z = z * Multiplier - offset Z, where
      each offset is (count - 1) * Multiplier / 2. The lattice is therefore centered on the origin
      and Multiplier is both the spacing between neighbors and the scale of the whole grid.
    - >-
      The points are written with X changing fastest, then Y, then Z. With the defaults (1 point on
      each axis, Multiplier 0.05) the output is a single point at the origin. Setting Number Z to 1
      gives a flat grid in the Z = 0 plane.
    - >-
      A negative Multiplier mirrors the lattice. Each count is limited to 100 by the control, which
      allows up to 1,000,000 points.
    - >-
      The output contains points only. vArrayGridConnect builds edge connectivity for a grid point
      array.
  features:
    - title: No input needed
      desc: The node generates its points from its own controls.
    - title: Three axes
      desc: Number X, Number Y and Number Z can each be set from 1 to 100.
    - title: Centered output
      desc: The lattice is offset so its center sits on the origin.
    - title: One spacing control
      desc: Multiplier sets the distance between neighbors on all three axes.
  connections:
    - label: Draw the grid
      lines:
        - vArrayPointsOnGrid.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Animate the grid with vArrayWave
      lines:
        - vArrayPointsOnGrid.Output -> vArrayWave.ArrayA
        - vArrayWave.Output -> vArrayCameraProjection.ArrayA
  difficulty: Beginner
  related:
    - name: vArrayPointsOnCube
      desc: The same lattice with a default of 10 points on each axis.
    - name: vArrayPointsOnHexagon
      desc: A staggered grid on a hexagon layout in 2D.
    - name: vArrayGridConnect
      desc: Builds edge connectivity for a grid point array.
  params:
    numx: Number of points along X. Range 1 to 100, default 1.
    numy: Number of points along Y. Range 1 to 100, default 1.
    mul: Distance between neighboring points on every axis. Range -1 to 1, default 0.05.
    numz: Number of points along Z. Range 1 to 100, default 1.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
legacy_text: Generate points on Array Grid
