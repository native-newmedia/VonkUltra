operation: Frustum
tools:
  Array: vArrayFrustum
  ScriptVal: vScriptValFrustum
  JSON: vJSONFrustum
legacy_names: []
curated:
  tagline: Generate points on a cone or truncated cone along the Z axis with separate bottom and top radii.
  overview: >-
    vArrayFrustum has no input and outputs an array of XYZ points on a frustum centered on the
    origin with its axis along Z. Bottom Radius and Top Radius set the taper, and Include Caps adds
    rings on both ends.
  description:
    - >-
      The side points form Height Segments + 1 rings from Z = -Height / 2 to Z = +Height / 2. The
      ring radius changes in equal steps from Bottom Radius to Top Radius. Each ring has Radial
      Segments points at X = radius * cos a and Y = radius * sin a, where a starts at 0 and advances
      by 360 / Radial Segments degrees.
    - >-
      With Include Caps on, the node adds Cap Rings + 1 rings at each end. The radius of cap ring k
      is the end radius * k / Cap Rings, so each cap runs from a single point on the axis to a ring
      at the full end radius. The last cap ring lies at the same position as the first or last side
      ring, so those points appear twice.
    - >-
      A ring whose radius is 0 is written as one point on the axis instead of Radial Segments
      overlapping points. A Top Radius of 0 therefore gives a cone with a single apex point. With
      the defaults (Bottom Radius 0.2, Top Radius 0.1, Height 0.5, 24 radial segments, 8 height
      segments, caps on with 4 cap rings) the node outputs 216 side points and 194 cap points, 410
      in total.
    - >-
      Radial Segments is clamped to 3 or more, Height Segments and Cap Rings to 1 or more, and
      Height to 0.001 or more. The radii are clamped to 0 or more. The output contains points only,
      with no edges or faces.
  features:
    - title: No input needed
      desc: The node generates its points from its own controls.
    - title: Separate end radii
      desc: Bottom Radius and Top Radius can differ, and either can be 0.
    - title: Filled caps
      desc: Include Caps adds Cap Rings + 1 concentric rings on each end.
    - title: Single-point apex
      desc: A ring with radius 0 is written as one point on the axis.
  connections:
    - label: Draw the frustum
      lines:
        - vArrayFrustum.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the frustum before drawing
      lines:
        - vArrayFrustum.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Beginner
  related:
    - name: vArrayCylinder
      desc: A cylinder with a single radius and a Cap Mode control.
    - name: vArrayTorus
      desc: Generates points on a torus.
    - name: vArrayGeodesicSphere
      desc: Generates points on a geodesic sphere.
  params:
    bottomradius: Radius of the ring at Z = -Height / 2. Minimum 0, default 0.2.
    topradius: Radius of the ring at Z = +Height / 2. Minimum 0, default 0.1.
    height: Length along Z. Minimum 0.001, default 0.5.
    radialsegments: Number of points around the axis in each ring. Clamped to 3 or more, default 24.
    heightsegments: >-
      Number of steps along the height, which gives this value plus one side rings. Clamped to 1 or
      more, default 8.
    includecaps: When on, adds concentric rings to the bottom and top ends. Default on.
    caprings: >-
      Number of steps from the axis to the rim of each cap. Clamped to 1 or more, default 4. Used
      only when Include Caps is on.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
