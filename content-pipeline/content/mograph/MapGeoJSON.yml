operation: MapGeoJSON
tools:
  Array: vArrayMapGeoJSON
  ScriptVal: vScriptValMapGeoJSON
  JSON: vJSONMapGeoJSON
legacy_names: []
curated:
  tagline: >-
    Project GeoJSON coordinates with the Web Mercator formula into flat XY points, with a group size
    for each shape.
  overview: >-
    vArrayMapGeoJSON takes GeoJSON text on its GeoJSON socket and outputs an array of XY points on a
    flat map, together with a Groups output that lists how many points each shape has. Center, zoom,
    scale and offset place the map.
  description:
    - >-
      The node reads a GeoJSON FeatureCollection and collects the coordinates of its Point, Polygon,
      MultiPolygon, LineString and MultiLineString features. Every polygon ring, line or point
      becomes one shape. A plain JSON array of shapes, each a list of [longitude, latitude] pairs,
      is also accepted. If the text is empty, cannot be read or holds no shapes, the output is
      empty.
    - >-
      Each position is projected with the Web Mercator formula on a map that is Map Zoom Width wide
      and 1 high. X = (longitude + 180) * Map Zoom Width / 360 and the vertical position comes from
      ln(tan(pi / 4 + latitude / 2)). The map is then shifted so that Center Longitude and Center
      Latitude sit at the origin, and Y points up.
    - >-
      Afterwards the points are scaled around their own average position by Scale * 1000 and shifted
      by Offset X and Offset Y. Because of the factor of 1000, the default Scale of 1 makes the map
      1000 times wider than the unscaled projection, and a Scale of 0.001 leaves it at the projected
      size. Z is always 0.
    - >-
      The Groups output holds the number of points of each shape in order, as a list. Use it with
      the nodes that take a Groups input to keep the shapes separate. The hidden Auto Fit control is
      read but not used.
  features:
    - title: GeoJSON input
      desc: Point, line, polygon and multipart features are read from a FeatureCollection.
    - title: Mercator projection
      desc: Longitude and latitude are converted to flat XY positions.
    - title: Map placement
      desc: Center Latitude, Center Longitude, Map Zoom Width, Scale and Offset position the result.
    - title: Shape groups
      desc: A second output lists the number of points in each shape.
  connections:
    - label: Draw the map outlines with their groups
      lines:
        - vArrayMapGeoJSON.Output -> vArrayCameraProjection.ArrayA
        - vArrayMapGeoJSON.ScriptVal_Groups -> vArrayCameraProjection.ArrayGroups
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - vArrayCameraProjection.Groups -> vArrayShapeRender.ArrayGroups
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the map before drawing
      lines:
        - vArrayMapGeoJSON.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Intermediate
  related:
    - name: vArrayFromOBJ
      desc: Reads OBJ text from a file, a URL or pasted text.
    - name: vArrayFromXYZ
      desc: Reads ASCII XYZ point cloud data.
    - name: vArrayFromSpline
      desc: Samples a mask spline into points.
  params:
    InMapZoomWidth: Width of the projected map, with a height of 1. Range 0.1 to 10, default 1.
    InCenterLat: Latitude that is placed at the origin, in degrees. Range -90 to 90, default 0.
    InCenterLon: Longitude that is placed at the origin, in degrees. Range -180 to 180, default 0.
    InScale: >-
      Scale around the average point position. The value is multiplied by 1000, so the range 0.001
      to 1 gives factors of 1 to 1000. Default 1.
    InOffsetX: Distance added to X after scaling. Default 0.
    InOffsetY: Distance added to Y after scaling. Default 0.
    InAutoFit: Hidden control. It is read by the node but has no effect. Default on.
    InArray: GeoJSON text to project.
status:
  source: ai
  state: ai
  reviewed_hash: null
  connections_source: docsify
  prompt_version: '1'
  note: >-
    Reworded after fix batch F3 (branch fix/findings-f3 of vonk-ultra-mograph): the decision was to
    keep the factor of 1000 on Scale, so the fuse was not changed. The Scale range 0.001 to 1 gives
    factors of 1 to 1000. Auto Fit is hidden, read and not used. Nothing was run in Fusion.
legacy_text: Map from geographic coordinates
