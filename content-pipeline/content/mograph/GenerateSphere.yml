operation: GenerateSphere
tools:
  Array: vArrayGenerateSphere
  ScriptVal: vScriptValGenerateSphere
  JSON: vJSONGenerateSphere
legacy_names: []
curated:
  tagline: >-
    Generate points along latitude circles and longitude lines of a sphere, with trim controls for
    the poles.
  overview: >-
    vArrayGenerateSphere has no input and outputs an array of XYZ points on circles of latitude and
    lines of longitude of a sphere around the origin, with the polar axis along Z. Number Lat Lines
    and Number Lon Lines set how many lines are drawn.
  description:
    - >-
      Number Lat Lines circles are spaced evenly in latitude between the poles, not including the
      poles. Each circle has 101 points, from longitude 0 to 360 degrees. A circle at latitude a has
      the radius Radius * cos(a) and sits at Z = Radius * sin(a), so the polar axis is Z.
    - >-
      Include Lon Lines (default off) adds Number Lon Lines lines spaced evenly in longitude, each
      running from the south pole to the north pole with up to 101 points. Trim Top and Trim Bottom
      are fractions of the 90 degrees from the equator to a pole. Points beyond them are left out of
      both the circles and the lines. With the defaults (Radius 0.3, 1 latitude line, no trim) the
      output is the 101 points of the equator circle.
  features:
    - title: No input needed
      desc: The node generates its points from its own controls.
    - title: Latitude and longitude lines
      desc: Lines are written as ordered points that follow each circle or meridian.
    - title: Pole trimming
      desc: Trim Top and Trim Bottom cut away points near the poles.
    - title: Fixed resolution per line
      desc: Each circle has 101 points and each meridian has 100.
  connections:
    - label: Draw the sphere lines
      lines:
        - vArrayGenerateSphere.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the sphere before drawing
      lines:
        - vArrayGenerateSphere.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Beginner
  related:
    - name: vArrayGeodesicSphere
      desc: Generates points on an icosphere instead of latitude and longitude lines.
    - name: vArrayPointsOnSphere
      desc: Places points on a sphere with a Fibonacci or random layout.
    - name: vArrayTorus
      desc: Generates points on a torus.
  params:
    radius: Radius of the sphere. Default 0.3.
    numLatLines: Number of latitude circles. Minimum 0, default 1.
    numLonLines: Number of longitude lines. Minimum 0, default 1.
    trimTop: >-
      Fraction of the 90 degrees from the equator to the north pole that is cut away at the top.
      Minimum -1, default 0.
    trimBot: >-
      Fraction of the 90 degrees from the equator to the south pole that is cut away at the bottom.
      Minimum -1, default 0.
    includeLonLines: >-
      When on, the longitude lines are written after the latitude circles. When off, only the
      circles are written. Default off.
status:
  source: ai
  state: ai
  reviewed_hash: null
  connections_source: docsify
  prompt_version: '1'
  note: >-
    Rewritten against the fuse after fix batch F3 (branch fix/findings-f3 of vonk-ultra-mograph).
    includeLonLines was read as a number and tested with if value then, so the longitude lines were
    always written. It is now tested with > 0.5 and defaults to off. Nothing was run in Fusion.
legacy_text: Generates a Sphere with longitude/latitude lines
