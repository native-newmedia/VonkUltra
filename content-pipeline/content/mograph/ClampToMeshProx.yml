operation: ClampToMeshProx
tools:
  Array: vArrayClampToMeshProx
  ScriptVal: vScriptValClampToMeshProx
  JSON: vJSONClampToMeshProx
legacy_names: []
curated:
  tagline: Moves points that are too far from, or too close to, the mesh vertices to a set distance.
  overview: >-
    vArrayClampToMeshProx takes an array of XYZ points and a mesh, and keeps each point at a set
    distance from its reference on the mesh. Clamp Mode picks whether it moves points outside or
    inside Max Distance.
  description:
    - >-
      For each point the node finds a reference on the mesh by Reference. Surface uses the closest
      vertex, or with Mesh Faces connected the closest point on the triangles. Vertex always uses
      the closest vertex. Centroid uses the closest patch point: the average of a vertex and its 7
      nearest neighbors, or a triangle center with Mesh Faces.
    - >-
      Outside > Max moves points whose distance is above Max Distance, Inside < Max moves points
      below it. They are put on the line from the reference through the point at Max Distance +
      Distance Offset. Clamp Blend (0 to 1) mixes the original and the clamped position. Affect X, Y
      and Z keep unchecked axes.
    - >-
      A point on its reference moves along the normal in Surface mode and along +Z otherwise.
      Preserve Extra Values (on) copies values after the third. With no mesh, Pass Through If No
      Mesh (on) outputs the points unchanged, otherwise the output is empty.
  features:
    - title: Two clamp directions
      desc: Outside > Max pulls far points in. Inside < Max pushes near points out.
    - title: Three references
      desc: Surface, Vertex and Centroid. Surface and Centroid use triangles with Mesh Faces.
    - title: Distance Offset
      desc: The target distance is Max Distance plus the offset.
    - title: Extra values kept
      desc: Values after X, Y and Z are copied to the output when Preserve Extra Values is on.
  connections:
    - label: Keep a grid within reach of a mesh and draw
      lines:
        - vArrayPointsOnGrid.Output -> vArrayClampToMeshProx.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayClampToMeshProx.MeshPoints
        - vArrayClampToMeshProx.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Clamp scattered points
      lines:
        - vArrayRandom.Output -> vArrayClampToMeshProx.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayClampToMeshProx.MeshPoints
        - vArrayClampToMeshProx.Output -> vArrayTranslate.Input
  difficulty: Advanced
  related:
    - name: vArrayAttractToMesh
      desc: Lerps input points toward the nearest mesh surface point.
    - name: vArrayWeightByMeshProx
      desc: Another node that uses the distance to a mesh.
    - name: vArraySortByMeshProx
      desc: Another node that uses the distance to a mesh.
  params:
    inmaxdistance: >-
      Distance that decides which points are clamped. Minimum 0 in the code, slider 0 to 2, default
      1.
    inclampmode: Outside > Max (default) or Inside < Max.
    inreferencemode: >-
      Surface (default), Vertex or Centroid. Surface and Vertex measure to the closest Mesh Points
      vertex. Centroid measures to the closest average of a vertex and its 7 nearest neighbors.
    inclampblend: Mix between the original (0) and the clamped position (1). Range 0 to 1, default 1.
    indistanceoffset: Added to Max Distance for the target distance. Slider -2 to 2, default 0.
    inaffectx: X is clamped when checked (default), otherwise it keeps the input value.
    inaffecty: Y is clamped when checked (default), otherwise it keeps the input value.
    inaffectz: Z is clamped when checked (default), otherwise it keeps the input value.
    inpreserveextras: Copies values after the third to the output when on (default).
    inpassthroughifnomesh: >-
      Outputs the points unchanged when there is no mesh data, if on (default). When off, the output
      is empty.
    MeshFaces: >-
      Optional. Face index lists of the mesh, from the Edges output of vArrayFromOBJ. Surface uses
      triangle points and Centroid uses triangle centers when connected. Not connected: vertices and
      neighbor averages.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The decision to clamp uses Max Distance only, while the target distance is Max Distance plus
    Distance Offset (not below 0). Max Distance is limited to 0 or more in the code. Surface and
    Vertex find the same reference point. A point that lies on its reference moves along the
    estimated normal in Surface mode and along +Z in Vertex and Centroid mode. It makes one sample
    per vertex with all three triangle corners equal to that vertex, so every search finds the
    closest vertex and not a point on a face. The normal of a sample is fitted to the 8 nearest
    vertices and points away from the centroid of all vertices. Edges and faces are not read. Since
    fix batch F5 the node has an optional Mesh Faces input (Edges output of vArrayFromOBJ); the text
    describes the node with and without it.
