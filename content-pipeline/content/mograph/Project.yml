operation: Project
tools:
  Array: vArrayProject
  ScriptVal: vScriptValProject
  JSON: vJSONProject
legacy_names: []
curated:
  tagline: Projects points onto a plane, a sphere or a cylinder, with a Blend amount.
  overview: >-
    vArrayProject takes an array of XYZ points and moves each onto the shape chosen by Mode. Blend
    sets how far, from 0 (no move) to 1 (on the shape).
  description:
    - >-
      The plane modes set one coordinate to Plane Z: Plane Z sets Z, Plane X sets X and Plane Y sets
      Y. Sphere moves each point along the line from Center to a distance of Radius from Center.
      Cylinder Z, Cylinder X and Cylinder Y do the same around the Z, X or Y axis through Center, so
      the coordinate along the axis stays as it is.
    - >-
      Blend (0 to 1, default 1) mixes between the original and the projected position. A point that
      sits exactly at the center or on the axis is put on the +X side. Defaults are Plane Z 0,
      Center 0, 0, 0 and Radius 0.5. The output has 3 values per point. Input that is not a list of
      points is passed through.
  features:
    - title: Seven shapes
      desc: Three planes, a sphere and three cylinders.
    - title: Blend
      desc: Blend mixes the original and the projected position.
    - title: Adjustable center
      desc: Center X, Y and Z place the sphere or cylinder.
    - title: Shared plane position
      desc: Plane Z holds the plane position for all three planes.
  connections:
    - label: Project a grid onto a sphere and draw
      lines:
        - vArrayPointsOnGrid.Output -> vArrayProject.Points
        - vArrayProject.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Flatten scattered points onto a plane
      lines:
        - vArrayRandom.Output -> vArrayProject.Points
        - vArrayProject.Output -> vArrayTranslate.Input
  difficulty: Beginner
  related:
    - name: vArrayProjectOnMesh
      desc: Projects input points onto the nearest mesh surface point.
    - name: vArrayCameraProjection
      desc: Transforms an Array using a perspective projection matrix.
    - name: vArrayAttractToMesh
      desc: Lerps input points toward the nearest mesh surface point.
  params:
    Mode: Plane Z (default), Sphere, Cylinder Z, Plane X, Plane Y, Cylinder X or Cylinder Y.
    PlaneZ: Position of the plane in Plane Z, Plane X and Plane Y modes. Default 0.
    CenterX: X of the center of the sphere or cylinder. Default 0.
    CenterY: Y of the center of the sphere or cylinder. Default 0.
    CenterZ: Z of the center of the sphere or cylinder. Default 0.
    Radius: Radius of the sphere or cylinder. Minimum 0.000001, default 0.5.
    Blend: Mix between the original (0) and the projected position (1). Range 0 to 1, default 1.
    Points: Points to project.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The control Plane Z is the plane position for Plane Z, Plane X and Plane Y. For Plane X the code
    sets X to it and for Plane Y it sets Y to it. A point at the center of a sphere or cylinder goes
    to the +X side of it. Input that does not start with a list is passed through unchanged.
