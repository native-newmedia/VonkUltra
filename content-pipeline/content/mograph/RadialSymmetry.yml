operation: RadialSymmetry
tools:
  Array: vArrayRadialSymmetry
  ScriptVal: vScriptValRadialSymmetry
  JSON: vJSONRadialSymmetry
legacy_names: []
curated:
  tagline: >-
    Copy a set of points around the Z axis into a number of rotated copies, with optional growing
    radius.
  overview: >-
    vArrayRadialSymmetry takes an array on its Input socket and outputs copies of it rotated around
    the Z axis. Copies sets the number of copies, and Angle Offset, Angle Step and Radius Step set
    where each copy goes.
  description:
    - >-
      Copy i, counting from 0, is rotated by Angle Offset + i * step degrees around the Z axis,
      where step is Angle Step. If Angle Step is 0, the step is 360 / Copies, which spreads the
      copies evenly around a full circle. Each copy is then moved outward by i * Radius Step along
      the direction of its own rotation angle. Z values are not changed.
    - >-
      The output holds Copies * the number of input points, ordered copy by copy. With the defaults
      (8 copies, Angle Offset 0, Angle Step 0, Radius Step 0) a single input point gives 8 points at
      45 degree spacing.
    - >-
      If nothing is connected or the input array is empty, the node uses one point at X = Fallback
      Radius, Y = 0, Z = 0 as the source. With the default Fallback Radius of 0.2 the node then
      outputs a ring of 8 points with radius 0.2.
    - >-
      Copies is clamped to 2 or more. A non-zero Angle Step lets the copies cover only an arc, or
      overlap, for example 15 degrees with 8 copies covers 105 degrees. A non-zero Radius Step turns
      the ring into a spiral.
  features:
    - title: Rotated copies
      desc: Every copy is the input rotated around the Z axis by its own angle.
    - title: Automatic angle step
      desc: An Angle Step of 0 spreads the copies evenly over 360 degrees.
    - title: Spiral option
      desc: Radius Step moves each further copy outward along its direction.
    - title: Works without an input
      desc: A single point at Fallback Radius is used when no array is connected.
  connections:
    - label: Repeat a small curve in a ring
      lines:
        - vArrayRoseCurve.Output -> vArrayRadialSymmetry.Input
        - vArrayRadialSymmetry.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Draw a ring of points with no input
      lines:
        - vArrayRadialSymmetry.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
  difficulty: Beginner
  related:
    - name: vArrayRepeat
      desc: Repeats point arrays with per-copy transform offsets.
    - name: vArrayMirror
      desc: Mirrors point arrays across an axis.
    - name: vArrayPointsOnCircle
      desc: Generates points on a circle.
  params:
    copies: Number of rotated copies. Clamped to 2 or more, default 8.
    angleoffset: Rotation of the first copy, in degrees. Default 0.
    anglestep: Rotation between copies, in degrees. 0 uses 360 divided by Copies. Default 0.
    fallbackradius: >-
      Distance of the single source point on the X axis when no input is connected. Minimum 0,
      default 0.2.
    radiusstep: Distance added for each further copy, along its rotation direction. Default 0.
    Input: Array of points to copy. Without it, one point at the Fallback Radius is used.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
