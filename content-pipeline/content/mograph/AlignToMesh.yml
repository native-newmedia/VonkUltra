operation: AlignToMesh
tools:
  Array: vArrayAlignToMesh
  ScriptVal: vScriptValAlignToMesh
  JSON: vJSONAlignToMesh
legacy_names: []
curated:
  tagline: >-
    Replaces each point with the normal at, the position of, or a blend toward the closest mesh
    vertex.
  overview: >-
    vArrayAlignToMesh takes an array of XYZ points and a mesh, and finds the closest Mesh Points
    vertex for every input point. Output Mode decides whether the node writes the normal estimated
    there, the vertex position, or a blend between the input and the vertex.
  description:
    - >-
      For every input point the node finds the closest vertex of Mesh Points. Output Mode then
      writes the normal estimated at that vertex (Normals), the vertex position (Surface), or a
      point between the input and the vertex (Blend). The normal is fitted to the 8 nearest vertices
      and points away from the center of the mesh.
    - >-
      In Normals mode the normal is scaled by Normal Length (default 1) and Flip Normals reverses
      it. Normal Anchor outputs it alone, adds it to the input point or adds it to the vertex.
      Affect X, Y and Z apply to Surface and Blend only: an unchecked axis keeps the input value.
      Blend To Surface (0 to 1, default 1) is used in Blend mode.
    - >-
      Only the vertex list of Mesh Points is used, not its edges or faces. If either input is empty,
      the output is empty.
  features:
    - title: Three output modes
      desc: Normals, Surface and Blend write different results from the same closest-point search.
    - title: Three normal anchors
      desc: The normal vector is output alone, at the input point or at the surface point.
    - title: Closest vertex
      desc: The search compares each point with the Mesh Points vertices, not with faces.
    - title: Per-axis switches
      desc: Affect X, Y and Z limit Surface and Blend to the checked axes.
  connections:
    - label: Align a grid to a loaded mesh and draw
      lines:
        - vArrayPointsOnGrid.Output -> vArrayAlignToMesh.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayAlignToMesh.MeshPoints
        - vArrayAlignToMesh.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Snap the points to the surface
      lines:
        - vArrayPointsOnGrid.Output -> vArrayAlignToMesh.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayAlignToMesh.MeshPoints
        - vArrayAlignToMesh.Output -> vArrayTranslate.Input
  difficulty: Intermediate
  related:
    - name: vArrayAttractToMesh
      desc: Lerps input points toward the nearest mesh surface point.
    - name: vArrayProjectOnMesh
      desc: Projects input points onto the nearest mesh surface point.
    - name: vArrayOffsetByNormal
      desc: Offsets each input point along the nearest mesh surface normal.
  params:
    outputmode: >-
      Normals (default), Surface or Blend. Normals writes the normal estimated at the closest
      vertex, Surface the vertex position and Blend a mix of input and vertex.
    innormallength: Length of the output normal. Minimum 0, slider 0 to 5, default 1. Shown in Normals mode only.
    innormalanchor: >-
      Vector (default) outputs the normal alone, At Input adds it to the input point and At Surface
      adds it to the closest vertex. Shown in Normals mode only.
    inflipnormals: Reverses the normal. Default off. Shown in Normals mode only.
    inblend: >-
      Mix between the input point (0) and the closest vertex (1). Range 0 to 1, default 1. Hidden
      unless Output Mode is Blend.
    inaffectx: >-
      Checked (default): X comes from the result. Unchecked: X keeps the input value. Surface and
      Blend only.
    inaffecty: >-
      Checked (default): Y comes from the result. Unchecked: Y keeps the input value. Surface and
      Blend only.
    inaffectz: >-
      Checked (default): Z comes from the result. Unchecked: Z keeps the input value. Surface and
      Blend only.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The registered description says "nearest mesh vertex" and matches the code. The old overview
    said the node finds the closest point on the mesh surface; it finds the closest vertex. Affect
    X, Y and Z are read in every mode but only change the result in Surface and Blend.
    vmeshutils.buildSurfaceSamples uses only the vertex list of Mesh Points. It makes one sample per
    vertex with all three triangle corners equal to that vertex, so every search finds the closest
    vertex and not a point on a face. The normal of a sample is fitted to the 8 nearest vertices and
    points away from the centroid of all vertices. Edges and faces are not read.
