operation: GenerateSpirals
tools:
  Array: vArrayGenerateSpirals
  ScriptVal: vScriptValGenerateSpirals
  JSON: vJSONGenerateSpirals
legacy_names: []
curated:
  tagline: >-
    Generate points on one of seven spirals, Archimedean, Atom, Cornu, Galilean, Hyperbolic,
    Logarithmic or Lituus.
  overview: >-
    vArrayGenerateSpirals has no input and outputs an array of XYZ points on the spiral chosen by
    Spiral Type. The Growth coefficient, Expansion factor, Max angle and Step size controls change
    meaning with the type, and only the ones the type uses are shown.
  description:
    - >-
      For Archimedean, Galilean, Hyperbolic, Logarithmic and Lituus the angle theta runs from Step
      size to Max angle * pi in steps of Step size. The radius is a + b * theta (Archimedean),
      theta^1.5 (Galilean), 1 / theta (Hyperbolic), a * e^(b * theta) (Logarithmic) or 1 /
      sqrt(theta) (Lituus), with a = Growth coefficient and b = Expansion factor. X and Y are
      rotated by Rotation (degrees) and multiplied by Scale Factor.
    - >-
      These five types write Z = theta * 0.05 * Scale Factor, so the spiral rises. Logarithmic
      writes three points per step (previous, midpoint, current), starting at the origin; with the
      defaults it outputs 54 points. Atom (r = a * sqrt(theta)) and Cornu (Euler spiral) write 10 *
      Step size + 1 points with Z = 0. Changing Spiral Type resets Scale Factor to 0.1 and Rotation
      to 0.
  features:
    - title: No input needed
      desc: The node generates its points from its own controls.
    - title: Seven spiral types
      desc: Spiral Type selects the formula, and the unused controls are hidden.
    - title: Rotation and scale
      desc: Rotation turns the spiral around Z and Scale Factor multiplies the finished positions.
    - title: Controls reset on type change
      desc: Choosing a new type sets Scale Factor to 0.1 and Rotation to 0.
  connections:
    - label: Draw the spiral
      lines:
        - vArrayGenerateSpirals.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the spiral before drawing
      lines:
        - vArrayGenerateSpirals.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Intermediate
  related:
    - name: vArrayLogarithmicSpiral
      desc: A separate node for the logarithmic spiral, with a Spiral and a Polygon mode.
    - name: vArrayCircularPoints
      desc: Places points on a circle or a spiral with a radius that grows by a fixed amount.
    - name: vArrayHelix
      desc: Generates points along a coil with a constant radius.
  params:
    spiraltype: >-
      Chooses the spiral formula. Changing it shows the controls the type uses and resets Scale
      Factor and Rotation. Default Logarithmic Spiral.
    num_a: >-
      Growth coefficient. Constant a in the Archimedean, Logarithmic and Atom spirals, and the end
      of the t range in the Cornu spiral. Default 0.04.
    num_b: >-
      Expansion factor. Constant b in the Archimedean and Logarithmic spirals, and 10 times it is
      the number of integration steps in the Cornu spiral. Default 0.22.
    num_c: >-
      Max angle in units of pi. The angle runs up to this value times pi. Not used by the Cornu
      spiral. Default 6.
    step: >-
      Angle step for most spirals. For Atom and Cornu, 10 times it is the number of points. Minimum
      0.01, default 1.
    _rotation: Angle the spiral is turned around the Z axis, in degrees. Default 0.
    scaleFactor: Multiplier applied to the finished positions. Minimum 0, default 0.1.
    mode: Hidden control. It is read by the node but has no effect on the output.
status:
  source: ai
  state: ai
  reviewed_hash: null
  connections_source: docsify
  prompt_version: '1'
  note: >-
    Rewritten against the fuse after fix batch F3 (branch fix/findings-f3 of vonk-ultra-mograph).
    The Logarithmic type wrote Z = 0 while vArrayLogarithmicSpiral writes Z = theta * 0.05. It now
    writes Z = theta * 0.05 * Scale Factor, like the other types that rise. The hidden Shape Mode
    control (mode) is read into inShape and never used. Nothing was run in Fusion.
legacy_text: Generate Spiral splines
