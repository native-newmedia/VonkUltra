operation: SortByDistance
tools:
  Array: vArraySortByDistance
  ScriptVal: vScriptValSortByDistance
  JSON: vJSONSortByDistance
legacy_names: []
curated:
  tagline: Reorders points into a nearest-neighbor chain that starts at the first point.
  overview: >-
    vArraySortByDistance takes an array of XYZ points and outputs them in a new order: the first
    point, then the closest unused point to it, and so on. The two controls do not change that
    order.
  description:
    - >-
      The first input point stays first. Each next point is the unused point that is closest to the
      one before. This produces a path that always steps to the nearest neighbor, which avoids long
      jumps when points are drawn in order. Points that are not lists of at least 3 values are
      dropped, and each output point has 3 values.
    - >-
      Smallest Distance (default 1) and Distance Mode (Preferred or Strict) are in the node, but in
      the code both end in the same choice, the nearest unused point, so they do not change the
      result. The search compares every unused point at every step, so it slows down with the square
      of the point count.
  features:
    - title: Nearest-neighbor path
      desc: Each point is followed by the closest point that is not used yet.
    - title: First point kept
      desc: The chain always starts at the first input point.
    - title: Points only
      desc: Elements without 3 values are dropped.
    - title: Controls without effect
      desc: Smallest Distance and Distance Mode do not change the order.
  connections:
    - label: Order scattered points and draw the path
      lines:
        - vArrayRandom.Output -> vArraySortByDistance.Array
        - vArraySortByDistance.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Order points loaded from a mesh
      lines:
        - vArrayFromOBJ.Points -> vArraySortByDistance.Array
        - vArraySortByDistance.Output -> vArrayResamplePath.Points
  difficulty: Beginner
  related:
    - name: vArraySortByMeshProx
      desc: Sorts points by distance to the nearest mesh surface point.
    - name: vArrayReverse
      desc: Reverses or reorders an array within a specified index range.
    - name: vArrayResamplePath
      desc: Resamples ordered paths to even spacing by count or distance.
  params:
    smallDist: Has no effect on the order in the code. Minimum 0, slider 0 to 10, default 1.
    Array: Points to sort.
    distanceMode: Preferred (default) or Strict. Has no effect on the order in the code.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    Smallest Distance and Distance Mode do not change the result. Both branches of the search end up
    choosing the nearest unvisited point: the "preferred" pick is the nearest point under Smallest
    Distance, and the fallback is the nearest point overall. In Strict mode the expression
    strictDistanceMode and nil or fallbackIndex still returns the fallback, because "x and nil" is
    never true in Lua. So the order is always the nearest-neighbor chain from the first point.
    Elements that are not lists of 3 or more values are dropped, and the output points have 3
    values.
legacy_text: Sort array by point distance
