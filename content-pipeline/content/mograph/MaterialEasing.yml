operation: MaterialEasing
tools:
  Array: vArrayMaterialEasing
  ScriptVal: vScriptValMaterialEasing
  JSON: vJSONMaterialEasing
legacy_names: []
curated:
  tagline: >-
    Moves each point along an offset by a Material Design 3 easing curve, started at a different
    time per point.
  overview: >-
    vArrayMaterialEasing takes an array of XYZ points and moves each one by Offset X, Y and Z along
    the chosen easing curve. Time drives the animation, and Stagger Mode and Stagger Delay start
    each point at a different time.
  description:
    - >-
      Each point is moved by Offset * eased(clamp((Time - Start Offset - delay * Stagger Delay) /
      Duration, 0, 1)). The easing is one of 20 cubic bezier curves selected by Easing Type, and the
      default is Emphasized Accelerate. Offset X, Y and Z default to 0, so nothing moves until one
      is set.
    - >-
      The delay comes from Stagger Mode. Index Order uses 0.1 per index. Distance from Center uses
      the distance to a center point times 10 times Scale factor, which defaults to 0. Random uses a
      repeatable value from 0 to 0.5 for each index. Stagger Delay defaults to 0.1.
    - >-
      Before a point's start the point stays in place. After the Duration it stays at the full
      Offset. With Duration 0 it jumps to the full Offset at its start. Expressive Fast Spatial
      overshoots by about 9 percent.
  features:
    - title: 20 easing curves
      desc: Easing Type offers Emphasized, Standard, Legacy and Expressive curves, each a cubic bezier.
    - title: Three stagger modes
      desc: Index Order, Distance from Center and Random set when each point starts.
    - title: Driven by a Time control
      desc: Time, Start Offset and Duration use the same units, and Time can be keyframed.
    - title: Curve preview
      desc: The Preview Curve section shows the selected curve as a row of bars.
  connections:
    - label: Ease a grid out and draw it
      lines:
        - vArrayPointsOnGrid.Output -> vArrayMaterialEasing.Input
        - vArrayMaterialEasing.Result -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Ease a circle, then move it
      lines:
        - vArrayPointsOnCircle.Output -> vArrayMaterialEasing.Input
        - vArrayMaterialEasing.Result -> vArrayTranslate.Input
  difficulty: Advanced
  related:
    - name: vArrayStagger
      desc: Offsets points with a wave-type curve driven by render time and shifted by index.
    - name: vArrayPointsJitter
      desc: Adds seeded random offsets and a time-based wobble to each point.
    - name: vArrayTranslate
      desc: Adds a fixed offset to all points.
  params:
    EaseType: >-
      One of 20 easing curves, default Emphasized Accelerate. Standard Fast, Default and Slow
      Spatial use one curve, and the three Standard Effects entries use the same curves as the three
      Expressive Effects entries. The Preview Curve section draws the selected curve.
    OffsetX: Distance each point moves on X by the end of the animation. Default 0.
    OffsetY: Distance each point moves on Y by the end of the animation. Default 0.
    OffsetZ: Distance each point moves on Z by the end of the animation. Default 0.
    StaggerDelay: Multiplier for the per-point delay from Stagger Mode. Slider 0 to 1, default 0.1.
    StaggerMode: >-
      Index Order, Distance from Center, or Random. Index Order delays point i by 0.1 * i, Random by
      a repeatable value from 0 to 0.5.
    FalloffX: >-
      Shifts the center used by Distance from Center on X. The center is the average of the points
      plus this value times 10. Shown only for that mode.
    FalloffY: >-
      Shifts the center used by Distance from Center on Y. The center is the average of the points
      plus this value times 10. Shown only for that mode.
    FalloffZ: >-
      Shifts the center used by Distance from Center on Z. The center is the average of the points
      plus this value times 10. Shown only for that mode.
    Scale factor: >-
      Converts distance from the center into delay: the distance is multiplied by this value times
      10. Default 0, so every point starts together. Shown only for Distance from Center.
    Time: Animation time, slider 0 to 1, default 0. Animate this value to play the easing.
    StartOffset: Time before the animation starts. Minimum 0, default 0.
    Duration: >-
      Time the easing takes to complete. Slider 0.01 to 10, minimum 0, default 1. 0 makes the move a
      step.
status:
  source: ai
  state: reviewed
  reviewed_hash: 57619cdf9491
  prompt_version: '1'
  note: >-
    Changed in fix batch F1 (branch fix/findings-f1 of vonk-ultra-mograph), same change in all three
    families. The Falloff shift was divided by the point count; the center is now the average of the
    points plus Falloff * 10. Duration 0 divided by zero; it is now a step. With no input points the
    Array fuse wrote "[]" and now writes an object with an empty "array" and size 0. Standard Fast,
    Default and Slow Spatial use one identical curve, and Standard Fast, Default and Slow Effects
    use the same curves as the three Expressive Effects entries; this was kept on purpose. Unused
    code: parseJSONArray and the totalPoints argument.
legacy_text: Animate points using Material Design 3 easing with staggered offsets
