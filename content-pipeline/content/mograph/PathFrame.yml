operation: PathFrame
tools:
  Array: vArrayPathFrame
  ScriptVal: vScriptValPathFrame
  JSON: vJSONPathFrame
legacy_names: []
curated:
  tagline: Builds a tangent, normal and binormal frame at every point of a path.
  overview: >-
    vArrayPathFrame takes a path and outputs a packet with the path and three vectors for each
    point. Up Mode picks the reference direction that keeps the frames from turning around the path.
  description:
    - >-
      The tangent at each point is the direction from the previous to the next point, so the end
      points use their one neighbor. With Closed Path on, the path wraps around. The normal comes
      from the cross product of the up vector and the tangent, the binormal from the tangent and the
      normal, and the normal is then recomputed from the binormal and the tangent.
    - >-
      Up Mode is World Y (default), World Z or Custom with Custom Up X, Y and Z (default 0, 1, 0,
      shown for Custom). A zero up vector becomes 0, 1, 0. Flip Tangent reverses the tangent
      vectors. The output packet holds the path, tangent, normal, binormal and the closed flag, for
      nodes such as vArrayPathTwist.
    - The input is a point array or a packet with a path.
  features:
    - title: Three vectors per point
      desc: Tangent, normal and binormal are written for every path point.
    - title: Three up modes
      desc: World Y, World Z or a custom up vector.
    - title: Closed paths
      desc: Closed Path wraps the first and last points.
    - title: Packet output
      desc: The result is a packet for path tools such as vArrayPathTwist.
  connections:
    - label: Frames for a path, then twist
      lines:
        - vArrayPointsOnArc.Output -> vArrayPathFrame.PathPacket
        - vArrayPathFrame.Output -> vArrayPathTwist.PathFramePacket
        - vArrayPathTwist.Output -> vArrayRenderSweepProfile.PathPacket
    - label: Frames to a sweep
      lines:
        - vArrayPointsOnCircle.Output -> vArrayPathFrame.PathPacket
        - vArrayPathFrame.Output -> vArrayRenderSweepProfile.PathPacket
  difficulty: Advanced
  related:
    - name: vArrayPathTwist
      desc: Applies roll or twist along path frames.
    - name: vArrayPathWidthMap
      desc: Generates per-point width or radius maps for a path sweep.
    - name: vArrayTangentVector
      desc: Creates a vector that is tangent to a curve or surface at a given point.
  params:
    UpMode: World Y (default), World Z or Custom. The reference direction for the normal.
    CustomUpX: X of the custom up vector. Default 0. Shown for Custom.
    CustomUpY: Y of the custom up vector. Default 1. Shown for Custom.
    CustomUpZ: Z of the custom up vector. Default 0. Shown for Custom.
    FlipTangent: Reverses the tangent vectors when on. Default off.
    ClosedPath: >-
      Treats the path as a closed loop when on. Default off. A closed flag in the input packet also
      closes it.
    PathPacket: A point array, or a packet with a path.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The output is a packet with the keys path, tangent, normal, binormal and closed, not an array of
    points. With fewer than 2 points the output is the usual array and size wrapper of the points
    instead. Flip Tangent reverses only the tangent vectors, not the normal and binormal. The closed
    flag in an input packet also closes the path, in addition to the Closed Path checkbox.
