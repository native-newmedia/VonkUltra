operation: ClassifyByMesh
tools:
  Array: vArrayClassifyByMesh
  ScriptVal: vScriptValClassifyByMesh
  JSON: vJSONClassifyByMesh
legacy_names: []
curated:
  tagline: Splits points into inside, outside and on-surface-band outputs relative to a mesh.
  overview: >-
    vArrayClassifyByMesh takes an array of XYZ points and a mesh, and writes each point to one of
    three outputs. The inside test checks which side of the plane at the nearest mesh point the
    point is on.
  description:
    - >-
      For each point the node finds the closest patch point (the average of a vertex and its 7
      nearest neighbors) and the normal estimated there, which points away from the center of the
      mesh. Points behind that normal go to Inside, others to Outside. With no mesh, every point
      goes to Outside. The output points are the input points, with their first three values only.
    - >-
      The test position can be shifted first. Normal offset space moves it along the normal of the
      closest vertex by Surface Offset Distance, reversed by Flip Normal. World space adds World
      Offset X, Y and Z. Affect X, Y and Z limit the shift to the checked axes.
    - >-
      Surface Band Thickness (default 0) sends points whose test position is within that distance of
      the closest mesh vertex to On Surface Band instead of Inside or Outside.
  features:
    - title: Three outputs
      desc: Inside, Outside and On Surface Band each carry a point array.
    - title: Offset test plane
      desc: The test position can be shifted along the normal or by a world offset.
    - title: Vertex band
      desc: Points close to a mesh vertex are separated from the other two groups.
    - title: Per-axis switches
      desc: Affect X, Y and Z restrict the shift of the test position.
  connections:
    - label: Draw only the points inside a mesh
      lines:
        - vArrayPointsOnGrid.Output -> vArrayClassifyByMesh.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayClassifyByMesh.MeshPoints
        - vArrayClassifyByMesh.Inside -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Use the outside points
      lines:
        - vArrayRandom.Output -> vArrayClassifyByMesh.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayClassifyByMesh.MeshPoints
        - vArrayClassifyByMesh.Outside -> vArrayTranslate.Input
  difficulty: Advanced
  related:
    - name: vArrayMaskByMesh
      desc: Makes a mask from points and a mesh.
    - name: vArrayTrimByMeshBounds
      desc: Removes points using mesh bounds.
    - name: vArrayClampToMeshProx
      desc: Keeps points at a set distance from a mesh.
  params:
    inoffsetspace: >-
      Normal (default) shifts the test position along the normal of the closest vertex. World shifts
      it by the World Offset values.
    insurfaceoffsetdistance: Shift along the normal in Normal space. Slider -1 to 1, default 0. Hidden in World space.
    inflipnormal: Reverses the normal used for the shift. Default off. Hidden in World space.
    inworldoffsetx: X shift of the test position in World space. Default 0. Hidden in Normal space.
    inworldoffsety: Y shift of the test position in World space. Default 0. Hidden in Normal space.
    inworldoffsetz: Z shift of the test position in World space. Default 0. Hidden in Normal space.
    inaffectx: The shift applies to X when checked (default).
    inaffecty: The shift applies to Y when checked (default).
    inaffectz: The shift applies to Z when checked (default).
    insurfacebandthickness: >-
      Points whose test position is within this distance of the closest mesh vertex go to the On
      Surface Band output. Minimum 0, slider 0 to 1, default 0 (no band).
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The old overview says the node outputs 1 for inside points and 0 for outside points, and the old
    Surface Band Thickness text says band points count as inside. The code writes three point arrays
    to three outputs (Inside, Outside, On Surface Band) and band points go only to the third. Affect
    X, Y and Z change only the offset test position, not the output points. Offset Space visibility
    is updated inside Process(). The inside test uses the patch samples (average of a vertex and its
    7 nearest neighbors) and their estimated normals, while the offset and the band use the vertex
    samples. Because normals point away from the centroid of all vertices, on concave shapes a
    normal can point the wrong way and the inside test can be wrong. vmeshutils.buildSurfaceSamples
    uses only the vertex list of Mesh Points. It makes one sample per vertex with all three triangle
    corners equal to that vertex, so every search finds the closest vertex and not a point on a
    face. The normal of a sample is fitted to the 8 nearest vertices and points away from the
    centroid of all vertices. Edges and faces are not read.
