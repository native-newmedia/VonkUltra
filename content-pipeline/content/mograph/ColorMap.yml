operation: ColorMap
tools:
  Array: vArrayColorMap
  ScriptVal: vScriptValColorMap
  JSON: vJSONColorMap
legacy_names: []
curated:
  tagline: Turns a number per point into a color between Color A and Color B.
  overview: >-
    vArrayColorMap reads a value for each index from the index, a scalar array, a point coordinate
    or the distance to a center, and outputs a list of RGBA colors. The color runs from Color A at
    the low end of the range to Color B at the high end.
  description:
    - >-
      The number of colors is the number of Points, else the number of Scalars, else Fallback Count
      (default 100). Source picks the value per index: the index, the Scalar Input value (the first
      value of a list), Position X, Y or Z of the point, or its distance to Center X, Y and Z.
    - >-
      With Auto Range on, the smallest and largest value become the range, otherwise Range Min and
      Range Max do. The position t is (value - min) / (max - min), clamped to 0 to 1 if Clamp 0-1 is
      on, then flipped to 1 - t if Invert is on. The color is Color A + (Color B - Color A) * t per
      channel, limited to 0 to 1.
    - >-
      A range of zero width gives t = value - min. The output is a ScriptVal list, for example for
      the Custom Color input of vArrayShapeRender.
  features:
    - title: Six value sources
      desc: Index, Scalar Input, Position X, Position Y, Position Z or Distance From Center.
    - title: Auto or manual range
      desc: Auto Range uses the smallest and largest value, or Range Min and Max are set by hand.
    - title: Two-color gradient
      desc: Color A and Color B each have red, green, blue and alpha.
    - title: Invert and clamp
      desc: Clamp 0-1 limits the position along the gradient and Invert reverses it.
  connections:
    - label: Color a grid by index and draw
      lines:
        - vArrayPointsOnGrid.Output -> vArrayColorMap.Points
        - vArrayPointsOnGrid.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - vArrayColorMap.Output -> vArrayShapeRender.JSONCustomColor
        - Background.Output -> vArrayShapeRender.Input
    - label: Color by a scalar array
      lines:
        - vArrayWeightMap.Output -> vArrayColorMap.Scalars
        - vArrayColorMap.Output -> vArrayShapeRender.JSONCustomColor
  difficulty: Intermediate
  related:
    - name: vArrayRampMap
      desc: Maps scalar sources to per-point RGBA colors using a 4-stop ramp.
    - name: vArrayWeightMap
      desc: Generates normalized per-point weight arrays.
    - name: vArrayShapeRender
      desc: Creates polygon dot shapes from an Array of XY point pairs.
  params:
    Source: >-
      Index (default), Scalar Input, Position X, Position Y, Position Z or Distance From Center. The
      position and distance sources give 0 when no Points are connected.
    AutoRange: Uses the smallest and largest value as the range when on (default).
    Clamp: Limits the position along the gradient to 0 to 1 when on (default).
    Invert: Reverses the gradient when on. Default off.
    FallbackCount: Number of colors when neither Points nor Scalars are connected. Minimum 1, default 100.
    CenterX: X of the center for Distance From Center. Default 0.
    CenterY: Y of the center for Distance From Center. Default 0.
    CenterZ: Z of the center for Distance From Center. Default 0.
    Red_A: Red of Color A, at the low end. Default 0.1.
    Green_A: Green of Color A. Default 0.4.
    Blue_A: Blue of Color A. Default 1.
    Alpha_A: Alpha of Color A. Default 1.
    Red_B: Red of Color B, at the high end. Default 1.
    Green_B: Green of Color B. Default 0.2.
    Blue_B: Blue of Color B. Default 0.2.
    Alpha_B: Alpha of Color B. Default 1.
    RangeMin: Low end of the manual range. Used when Auto Range is off. Default 0.
    RangeMax: High end of the manual range. Used when Auto Range is off. Default 1.
    Points: Optional points. They set the count and feed the position and distance sources.
    Scalars: Optional numbers. They feed the Scalar Input source.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The old texts for Red B, Green B, Blue B and Alpha B said "color A". The Array fuse has the data
    type ScriptVal: it reads Points and Scalars as arrays and writes a list of {R, G, B, A} tables,
    not an array of numbers. Clamp 0-1 clamps the 0 to 1 position along the gradient, and the output
    channels are clamped to 0 to 1 in every case.
