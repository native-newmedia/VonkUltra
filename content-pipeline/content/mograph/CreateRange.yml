operation: CreateRange
tools:
  Array: vArrayCreateRange
  ScriptVal: vScriptValCreateRange
  JSON: vJSONCreateRange
legacy_names:
  - vArrayCreate
curated:
  tagline: >-
    Generate a list of numbers from a constant, a 0 to 1 ramp, a 1,2,3 counter or a low to high
    range, packed as X, X Y or X Y Z.
  overview: >-
    vArrayCreateRange has no input and outputs an array of numbers grouped into entries of one, two
    or three values. Mode Select chooses how the numbers are made, Array length sets how many, and
    Pack To sets the entry size.
  description:
    - >-
      The node first makes Array length numbers. In Num mode every number is the value of Number. In
      0-1 mode number i of n is (i - 1) / (n - 1), a ramp from 0 to 1. In 1,2,3 mode number i is i.
      In Range mode the numbers are spaced evenly from Low to High, with number i equal to Low + (i
      - 1) * (High - Low) / (n - 1).
    - >-
      If Reverse Array is on, the list of numbers is reversed. The numbers are then packed into
      entries by Pack To: X gives entries of one value, X Y gives entries of two and X Y Z gives
      entries of three. If the count does not divide evenly, the last entry holds the remaining
      values and is shorter.
    - >-
      With the defaults (Array length 2, 0-1 mode, Pack To X) the output is two entries, 0 and 1.
      Number is shown only in Num mode, and Low and High only in Range mode. Array length has a
      minimum of 2. Show Input adds a connection point to the Array length control so that the
      length can be driven from another node.
    - >-
      The node produces values, not geometry. Set Pack To to X Y Z to use the output as points, or
      use it with the Modify nodes as a source of values.
  features:
    - title: No input needed
      desc: The node generates its values from its own controls.
    - title: Four fill modes
      desc: Num, 0-1, 1,2,3 and Range cover constants, ramps, counters and spans.
    - title: Reverse option
      desc: Reverse Array flips the order of the numbers before they are packed.
    - title: Packing choice
      desc: Pack To writes entries of one, two or three values.
  connections:
    - label: Draw the values as points, with Pack To set to X Y Z
      lines:
        - vArrayCreateRange.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the values before drawing
      lines:
        - vArrayCreateRange.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Beginner
  related:
    - name: vArrayList
      desc: Creates an array from values typed in one by one.
    - name: vArrayRandom
      desc: Creates random values between a low and a high limit.
    - name: vArrayMinMax
      desc: Creates random values with a separate range for each value in an entry.
  params:
    arrayLength: Number of numbers made before packing. Minimum 2, default 2.
    'ModeSelect ': >-
      Num repeats Number, 0-1 makes a ramp from 0 to 1, 1,2,3 counts up from 1, Range spaces values
      from Low to High. Default 0-1.
    Number: Hidden unless Mode Select is Num. The value written for every number in Num mode. Default 0.
    reversearray: Reverses the order of the numbers before packing. Default off.
    InputNumber: Number of values in each entry, X, X Y or X Y Z. Default X.
    ShowInput: Shows or hides a connection point on the Array length control. Default off.
    Low: Hidden unless Mode Select is Range. First value of the range. Default -1.
    High: Hidden unless Mode Select is Range. Last value of the range. Default 1.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
