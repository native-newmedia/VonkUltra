operation: ShapeRender
tools:
  Array: vArrayShapeRender
  ScriptVal: vScriptValShapeRender
  JSON: vJSONShapeRender
legacy_names: []
curated:
  tagline: >-
    The final render node — takes a projected point array and draws shapes, lines, and custom
    geometry at every position.
  overview: >-
    vArrayShapeRender is the terminal node in every vArray pipeline. It reads an array of projected
    2D screen-space positions and renders configurable shapes — dots, lines, custom polygons, or
    text paths — at each point, composited over a background image.
  description:
    - >-
      vArrayShapeRender is the terminal node in every vArray rendering pipeline. It takes the
      screen-space point array produced by vArrayCameraProjection and draws configurable shapes at
      each position — dots, connecting lines, custom polygons, or indexed text labels — composited
      over a Background image input. Everything upstream in the pipeline — generators, modifiers,
      projections — exists to feed this node with the right point data.
    - >-
      The node is built around five independent render layers, each with its own toggle. The Dots
      layer renders a polygon shape (3–32+ sides, controlled by Dot Sides) at each point position.
      The Lines layer draws connections between sequential points, or between explicit pairs when
      Use Edge Data is enabled with an ArrayEdge input. The Custom Shapes layer renders arbitrary 2D
      polygons from a vArrayCustom2DShapes node at each position. The Text Index layer renders the
      array index number at each point — invaluable for debugging point ordering. Each layer has its
      own colour picker and optional outline stroke, and all layers can be active simultaneously.
    - >-
      Four array inputs make ShapeRender the hub that unifies a pipeline. ArrayPoint is the primary
      position input — always required, always from vArrayCameraProjection. ArrayEdge provides
      explicit point-to-point connectivity for graph, network, and circuit-board visuals. ArrayShape
      carries custom polygon definitions for each point. ArrayGroups carries group membership data
      from text-path and font generators, used to control which points connect to which.
    - >-
      Colour handling is per-layer via RGBA pickers, but can be overridden per-point using the JSON
      Custom Color input — connect a vArrayColor node here to drive individual point colours from
      data. This makes vArrayShapeRender capable of full data-driven colour mapping without any
      post-processing nodes.
    - >-
      Performance scales directly with point count and enabled layers. The Lines and Custom Shapes
      layers are the most expensive — disable them during design if working with large arrays. The
      Show Index layer is a debug tool and should be disabled before final render. All layer toggles
      are animatable, which means you can use them as on/off switches driven by keyframes in reveal
      sequences.
  features:
    - title: Five independent render layers
      desc: >-
        Dots, Lines, Custom Shapes, Text Index, and Outlines — each with its own toggle, colour, and
        size controls.
    - title: Four array inputs
      desc: >-
        Accepts separate inputs for points, edges, custom shapes, and groups — making it compatible
        with every generator and modifier in the pipeline.
    - title: Custom polygon shapes
      desc: >-
        Connect vArrayCustom2DShapes to ArrayShape to render arbitrary polygons at each point
        position instead of default circles.
    - title: Edge connectivity
      desc: >-
        Use Edge Data mode with the ArrayEdge input to draw explicit connections between points —
        essential for graph, network, and circuit-board visuals.
  connections:
    - label: Standard pipeline — dots at projected points
      lines:
        - vArrayFromOBJ.Points -> vArrayCameraProjection.ArrayA
        - vArrayFromOBJ.Edges -> vArrayShapeRender.ArrayEdge
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: With custom polygon shapes
      lines:
        - vArrayPointsOnCircle.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - vArrayCustom2DShapes.Output -> vArrayShapeRender.ArrayShape
        - Background.Output -> vArrayShapeRender.Input
    - label: Full pipeline — points, edges, shapes, groups
      lines:
        - vArrayCreateTextFont.Output -> vArrayCameraProjection.ArrayA
        - vArrayCreateTextFont.ScriptVal_Groups -> vArrayShapeRender.ArrayGroups
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - vArrayCustom2DShapes.Output -> vArrayShapeRender.ArrayShape
        - Background.Output -> vArrayShapeRender.Input
  difficulty: Intermediate
  related:
    - name: vArrayRenderTextPath
      desc: Variant that renders text strings along a path array rather than shapes at point positions.
    - name: vArrayCustom2DShapes
      desc: Generates the custom shape definitions that feed into vArrayShapeRender's ArrayShape input.
    - name: vArrayColor
      desc: >-
        Applies per-point colour data to the pipeline, feeding into vArrayShapeRender's JSON Custom
        Color input.
  params:
    unconnectlines: >-
      When enabled, line connections are drawn using the explicit edge pairs from the ArrayEdge
      input rather than connecting sequential points.
    showlines: >-
      Toggles the line layer. When enabled, lines are drawn between points using the Line Width and
      Line Color settings.
    showdots: >-
      Toggles the dot layer. Dots are rendered at each point position using Dot Sides, Dot Radius,
      and Dot Color.
    showcustom_shapes: >-
      Toggles the custom shape layer. Renders shapes from the ArrayShape input at each point
      position.
    showindex: >-
      Renders the array index number at each point position. Useful for debugging pipelines and
      understanding point ordering.
    lineWidth: Stroke width of connecting lines in normalised units. Scale relative to composition size.
    DotlineWidth: Stroke width of the dot outline when Render Outline Dots is enabled.
    connectgroups: >-
      When enabled, line connections are drawn between points within each text group from the
      ArrayGroups input.
    Outline_lines: Enables stroke rendering for the line layer. Disable for a filled-only line appearance.
    hidedots: >-
      Hides the default circular dot shape at each point, while still allowing custom shapes or
      lines to render.
    outlinedots: Renders a stroke outline around each dot in addition to the fill.
    dotSides: >-
      Number of polygon sides for each dot. 3 = triangle, 4 = square, 6 = hexagon, 32+ = circle
      approximation.
    dotRadius: Radius of each dot in normalised units.
    DotsScale: Uniform scale multiplier applied to all dots. Animatable for grow/shrink effects.
    Custom_Outline: Renders a stroke outline around each custom shape.
    Custom_Outline_BG: Renders an outline around the background area of each shape.
    customScale: Uniform scale multiplier applied to all custom shapes.
    TextSize: Size of the index label text rendered at each point when Show Index is enabled.
    TextStyle: Style index for the index label font.
    LineType: 'Stroke pattern for connecting lines: Solid, Dashed, Dotted, or Dash-Dot.'
    JoinType: 'Corner join style where lines meet: Miter, Bevel, or Round.'
    Input: >-
      Background image input. The rendered shapes are composited over this image. Connect a
      Background node here.
    ArrayPoint: Screen-space 2D point array. Connect the Output of vArrayCameraProjection here.
    ArrayEdge: >-
      Edge connectivity array. Defines explicit point-to-point connections for the line layer. Use
      with vArrayFromOBJ or vArrayPointsConnect.
    ArrayShape: >-
      Custom shape definitions array. Connect vArrayCustom2DShapes or vArrayCustom3DShapes here to
      render arbitrary polygons at each point.
    ArrayGroups: >-
      Group membership array for multi-group rendering. Used with font and text-path generators that
      output group data.
    JSONCustomColor: >-
      Per-point colour override array in JSON format. When connected, individual point colours
      override the global dot/shape colour settings.
    closeedgeloops: Connects the end of each edge loop to its start.
    maxlinedistance: Longest line that is drawn. 0 means no limit.
    color_line: Default or Custom color.
    Red_line: Color for the line.
    Green_line: Color for the line.
    Blue_line: Color for the line.
    Alpha_line: Color for the line.
    color_dot: Default or Custom color.
    Red_dot: Color for the line.
    Green_dot: Color for the line.
    Blue_dot: Color for the line.
    Alpha_dot: Color for the line.
    CustomlineWidth: Outline width of the shapes.
    CustomlineWidth_BG: Outline width of the background.
    color_Cshape: Default or Custom color.
    Red_Shape: Color for the line.
    Green_Shape: Color for the line.
    Blue_Shape: Color for the line.
    Alph_Shape: Color for the line.
    Red_Shape_BG: Color for the line.
    Green_Shape_BG: Color for the line.
    Blue_Shape_BG: Color for the line.
    Alph_Shape_BG: Color for the line.
    Red_txt: Color for the line.
    Green_txt: Color for the line.
    Blue_txt: Color for the line.
    Alpha_txt: Color for the line.
