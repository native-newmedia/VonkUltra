operation: Translate
tools:
  Array: vArrayTranslate
  ScriptVal: vScriptValTranslate
  JSON: vJSONTranslate
legacy_names: []
curated:
  tagline: Adds an XYZ offset to every point, then multiplies it by a scale.
  overview: >-
    vArrayTranslate takes an array of XYZ points and outputs (point + offset) * scale for each axis.
    X Scale is used for X and Z, and for Y while Lock X/Y is on. Y Scale is used for Y when Lock X/Y
    is off.
  description:
    - >-
      Each point becomes ((x + X Offset) * X Scale, (y + Y Offset) * Y Scale, (z + Z Offset) * X
      Scale). The offsets default to 0 and the scales to 1, so the default leaves the points
      unchanged. Because the scale is applied after the offset, it also scales the offset.
    - >-
      Lock X/Y is on by default. While it is on, Y Scale is hidden and Y uses X Scale. With it off,
      Y Scale scales Y on its own. Show Input exposes the offsets and scales as input ports.
      Elements that are not lists of at least 3 values are dropped, and the output points have 3
      values.
  features:
    - title: Offset per axis
      desc: X, Y and Z Offset are added to the coordinates.
    - title: Scale after the offset
      desc: >-
        X Scale multiplies X and Z, and Y as well while Lock X/Y is on. Y Scale multiplies Y when it
        is off.
    - title: Connectable values
      desc: Show Input exposes the offsets and scales as input ports.
    - title: Unchanged by default
      desc: Offsets of 0 and scales of 1 leave the points as they are.
  connections:
    - label: Reposition a grid and draw
      lines:
        - vArrayPointsOnGrid.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Move a circle after jitter
      lines:
        - vArrayPointsOnCircle.Output -> vArrayPointsJitter.Input
        - vArrayPointsJitter.Output -> vArrayTranslate.ArrayA
  difficulty: Beginner
  related:
    - name: vArrayCameraProjection
      desc: Transforms an Array using a perspective projection matrix.
    - name: vArrayRepeat
      desc: Repeats point arrays with per-copy transform offsets.
    - name: vArrayMirror
      desc: Mirrors point arrays across an X, Y or Z axis with optional combine.
  params:
    Translate_X: Added to X before the scale. Default 0.
    Translate_Y: Added to Y before the scale. Default 0.
    Translate_Z: Added to Z before the scale. Default 0.
    LockXY: When on (default), Y uses X Scale and Y Scale is hidden. When off, Y Scale is used for Y.
    Scale.X: Multiplies X and Z after the offset. Default 1. Also multiplies Y while Lock X/Y is on.
    ArrayA: Points to move.
    ShowInput: Shows the input ports of the offsets and scales when on. Default off.
    Scale.Y: Multiplies Y after the offset when Lock X/Y is off. Default 1. Hidden while it is on.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    Rewritten against the fuse after fix batch F2 (branch fix/findings-f2 of vonk-ultra-mograph):
    with Lock X/Y on, Y now uses X Scale, and the comment in Process() no longer mentions rotation.
    X Scale is used for X and Z. The offset is added before the scale, so the scale also multiplies
    the offset. Elements that are not lists of 3 or more values are dropped. Show Input exposes the
    ports of the offsets and scales; the old text said it reveals the Array A port. Nothing was run
    in Fusion.
