operation: CameraProjection
tools:
  Array: vArrayCameraProjection
  ScriptVal: vScriptValCameraProjection
  JSON: vJSONCameraProjection
legacy_names: []
curated:
  tagline: Rotates, shifts and scales points, then projects them to 2D with a perspective divide.
  overview: >-
    vArrayCameraProjection takes an array of XYZ points and outputs 2D points. It also outputs an
    Edges array for the points and passes a Groups input through. The output feeds
    vArrayShapeRender.
  description:
    - >-
      Each point is rotated by X, Y and Z Rotation (degrees, in the order X, Y, Z) around the
      centroid of the points, or the origin if Rotate Around Center is off. Then X, Y and Z Offset
      are added, X Scale multiplies X and Z, and Y Scale multiplies Y.
    - >-
      With s = 1 / tan(fov / 2), the output is X = 0.5 + s * x / (2 * -z) and Y = s * y / (2 * -z)
      plus an offset from an internal reference image. A Z near 0 is replaced by a small number.
    - >-
      An Edge input is passed to the Edges output. Without one, Auto Create Edges (on) writes one
      edge through all points in order, and it returns to point 1 when Close Edge Loop is off.
      Groups pass through unchanged.
  features:
    - title: Perspective projection
      desc: Field of view sets the divide, and the output has two values per point.
    - title: Rotation around the centroid
      desc: Rotate Around Center turns the points around their average or around the origin.
    - title: Edge output
      desc: Edges pass through, or one edge through all points is generated.
    - title: Groups pass-through
      desc: The Groups input is copied to the Groups output unchanged.
  connections:
    - label: Project a circle and draw it
      lines:
        - vArrayPointsOnCircle.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Draw the edges of a loaded mesh
      lines:
        - vArrayFromOBJ.Points -> vArrayCameraProjection.ArrayA
        - vArrayFromOBJ.Edges -> vArrayCameraProjection.ArrayEdge
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - vArrayCameraProjection.Edges -> vArrayShapeRender.ArrayEdge
        - Background.Output -> vArrayShapeRender.Input
  difficulty: Intermediate
  related:
    - name: vArrayShapeRender
      desc: Creates polygon dot shapes from an Array of XY point pairs.
    - name: vArrayTranslate
      desc: Translates the positions of an Array without projecting them.
    - name: vArrayLookAt
      desc: Builds per-point look-at direction vectors.
  params:
    Translate.X: Added to the X value of every point before projection. Default 0.
    Translate.Y: Added to the Y value of every point before projection. Default 0.
    Translate.Z: Added to the Z value of every point before the divide by Z. Default 1.
    Rotate.X: Rotation around X in degrees, slider to 360. Default 0.
    Rotate.Y: Rotation around Y in degrees, slider to 360. Default 0.
    Rotate.Z: Rotation around Z in degrees, slider to 360. Default 0.
    LockXY: When on (default), X Scale is used for both X and Y. Y Scale is shown when it is off.
    Scale.X: Multiplies X and Z. Default 1. Also multiplies Y while Lock X/Y is on.
    fov: Field of view in degrees. Default 90.
    ArrayA: Primary 3D point array input. Connect the output of any vArray generator or modifier here.
    RotateAroundCenter: Rotates around the centroid of the points when on (default), around the origin when off.
    Scale.Y: Multiplies Y when Lock X/Y is off. Default 1. Hidden while it is on.
    AutoEdges: >-
      When on (default) and no Edge input is connected, writes one edge through all points. Needs 2
      or more points.
    CloseEdgeLoop: >-
      Default off. In the code the generated edge returns to the first point when this is off, and
      ends at the last point when it is on.
    RotOrder: Hidden control, not read by the code. The rotation order is always X, Y, Z.
    aspect_ratio: Hidden. Screen aspect ratio, default 16 / 9. It cancels out of the X result.
    near: Hidden. Near clipping plane, default 0.1. Read but not used in the projection.
    for: Hidden. Far clipping plane, default 1000. Read but not used in the projection.
    Shear.X: Hidden. Default 0. Read but not used.
    Shear.Y: Hidden. Default 0. Read but not used.
    ArrayEdge: Optional edges. When connected, they are passed to the Edges output.
    ArrayGroups: Optional groups. Passed to the Groups output unchanged.
    ScriptValEdge: ScriptVal family. Optional edges. When connected, they are passed to the Edges output.
    ScriptValGroups: ScriptVal family. Optional groups. Passed to the Groups output unchanged.
    JSONEdge: JSON family. Optional edges. When connected, they are passed to the Edges output.
    JSONGroups: JSON family. Optional groups. Passed to the Groups output unchanged.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The old text describes a camera: X, Y and Z Offset are added to the point coordinates before the
    projection, not applied to a camera. Rotation Order is created but hidden and Process() never
    reads it; the rotation order is always X, then Y, then Z. Near and Far are hidden and read but
    not used by the projection. Shear X and Y are hidden, read and not used. The old text says Close
    Edge Loop connects the last edge to the first, but the code closes the edge when the checkbox is
    off and leaves it open when it is on. The Y output adds convertY(0.5), computed from an Image
    created inside the node with an original size of 0; the resulting value was not checked at
    runtime. The old tagline and overview call the node mandatory, which the code does not require.
legacy_text: Transforms Array using a perspective projection matrix
