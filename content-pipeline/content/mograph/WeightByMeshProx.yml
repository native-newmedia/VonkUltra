operation: WeightByMeshProx
tools:
  Array: vArrayWeightByMeshProx
  ScriptVal: vScriptValWeightByMeshProx
  JSON: vJSONWeightByMeshProx
legacy_names: []
curated:
  tagline: Outputs a 0 to 1 weight per point from its distance to the closest mesh vertex.
  overview: >-
    vArrayWeightByMeshProx takes an array of XYZ points and a mesh, and outputs one weight per point
    on the Output socket. A second output, Points, holds the points projected toward the mesh.
  description:
    - >-
      For each point the node finds the closest Mesh Points vertex and takes the distance d. The raw
      weight is min(1, d / Max Distance), which is 0 at the mesh and 1 at Max Distance or farther.
      Falloff shapes it: Linear uses it as it is, Squared squares it, Root takes the square root.
      Invert Weight turns the weight into 1 minus it. Max Distance defaults to 0.5 and has a minimum
      of 0.0001.
    - >-
      The Points output holds each point moved toward its closest vertex by Project Amount (0 to 1,
      default 1), so by default it holds the vertices. Both outputs have the array and size wrapper.
      With an empty mesh both outputs are empty.
  features:
    - title: Weights from distance
      desc: Weight is 0 on the mesh and 1 at Max Distance and beyond.
    - title: Three falloff shapes
      desc: Linear, Squared and Root shape the weight.
    - title: Second output
      desc: Points holds the points moved toward the mesh by Project Amount.
    - title: Invertable
      desc: Invert Weight turns the weight into 1 minus it.
  connections:
    - label: Use weights as a mask
      lines:
        - vArrayPointsOnGrid.Output -> vArrayWeightByMeshProx.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayWeightByMeshProx.MeshPoints
        - vArrayWeightByMeshProx.Output -> vArrayApplyMask.Mask
    - label: Color points by distance to the mesh
      lines:
        - vArrayPointsOnGrid.Output -> vArrayWeightByMeshProx.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayWeightByMeshProx.MeshPoints
        - vArrayWeightByMeshProx.Output -> vArrayRampMap.Scalars
  difficulty: Intermediate
  related:
    - name: vArrayWeightMap
      desc: Generates normalized per-point weight arrays.
    - name: vArrayMaskByMesh
      desc: Keeps only input points within a distance threshold of the mesh surface.
    - name: vArraySortByMeshProx
      desc: Sorts points by ascending distance to the nearest mesh surface point.
  params:
    maxdistance: Distance at which the weight reaches 1. Minimum 0.0001, slider 0.0001 to 10, default 0.5.
    falloff: Linear (default), Squared or Root. The shape of the weight.
    invertweight: Uses 1 minus the weight when on. Default off.
    projectamount: How far the Points output moves toward the closest vertex. Range 0 to 1, default 1.
    ArrayPoints: Points to weigh.
    MeshPoints: Mesh vertices that distances are measured to.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The weight is 0 on the mesh and grows to 1 at Max Distance (not the other way around); Invert
    Weight flips it. Distances are measured to the closest mesh vertex. The second output, Points,
    holds the points moved toward that vertex by Project Amount, which defaults to 1, so by default
    it holds the vertices. With no mesh data both outputs are empty. The ScriptVal and JSON fuses
    name the outputs differently.
