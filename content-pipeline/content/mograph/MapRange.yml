operation: MapRange
tools:
  Array: vArrayMapRange
  ScriptVal: vScriptValMapRange
  JSON: vJSONMapRange
legacy_names: []
curated:
  tagline: Remaps every number in an array from its own smallest and largest value to a new range.
  overview: >-
    vArrayMapRange finds the smallest and the largest number in the whole input and maps that range
    linearly to New Min and New Max. The four Mode Select buttons are shortcuts for common new
    ranges.
  description:
    - >-
      The node scans every number in the input, including numbers inside lists, and takes the
      smallest and largest one. Each number v then becomes NewMin + (v - min) * (NewMax - NewMin) /
      (max - min). The range is shared by all values and axes, so X, Y and Z are not remapped on
      their own. Text values that read as numbers are remapped too, and other values pass through.
    - >-
      Mode Select does not change the calculation. Its buttons -10 - 10, -1 - 1, 0 - 1 and 0 - 360
      write those numbers into New Min and New Max when pressed. New Min and New Max default to -1
      and 1. If every number is equal, all become New Min. The output is not clamped. When the input
      is a table with an array key, the other keys of that table are kept in the output.
  features:
    - title: Linear remap
      desc: The input range is stretched to the range from New Min to New Max.
    - title: Works on nested data
      desc: Numbers inside points and other lists are remapped, other values are kept.
    - title: Preset ranges
      desc: Four buttons set New Min and New Max to common ranges.
    - title: One shared range
      desc: The smallest and largest number of the whole array set the source range.
  connections:
    - label: Remap displaced points and draw
      lines:
        - vArrayPointsOnGrid.Output -> vArrayDisplaceValues.ArrayA
        - vArrayDisplaceValues.Output -> vArrayMapRange.ArrayA
        - vArrayMapRange.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Remap noise values
      lines:
        - vArrayNoise.Output -> vArrayMapRange.ArrayA
        - vArrayMapRange.Output -> vArrayApplyMask.Mask
  difficulty: Beginner
  related:
    - name: vArrayMap
      desc: Normalizes Array values using various methods.
    - name: vArrayClamp
      desc: Clamps numeric values in nested arrays and tables.
    - name: vArrayMath
      desc: Applies math operations to an Array.
  params:
    'ModeSelect ': >-
      Buttons for -10 - 10, -1 - 1, 0 - 1 and 0 - 360. Pressing one sets New Min and New Max. The
      node does not read the selected button.
    ArrayA: >-
      Primary point array input. Connect any upstream vArray generator or modifier here to apply
      range mapping to its values.
    NewMin: Value that the smallest input number becomes. Allowed -50 to 50, default -1.
    NewMax: Value that the largest input number becomes. Allowed -50 to 50, default 1.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    Rewritten against the fuse after fix batch F4 (branch fix/findings-f4 of vonk-ultra-mograph).
    The Array fuse now keeps the other keys of a wrapped input table, like the ScriptVal and JSON
    fuses; a bare list input still gives the array and size wrapper. Batch F1 changed New Min and
    New Max to default to -1 and 1 to match the default "-1 - 1" button. Mode Select is not read:
    the four buttons only write New Min and New Max. The control ID of Mode Select ends with a space
    ("ModeSelect ") and was kept. The Array fuse has an unused shuffleArray helper. Nothing was run
    in Fusion.
legacy_text: Map Range Operations on an Array
