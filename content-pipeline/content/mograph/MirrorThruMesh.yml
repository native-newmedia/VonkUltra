operation: MirrorThruMesh
tools:
  Array: vArrayMirrorThruMesh
  ScriptVal: vScriptValMirrorThruMesh
  JSON: vJSONMirrorThruMesh
legacy_names: []
curated:
  tagline: Reflects each point through the closest mesh vertex, by a Blend amount.
  overview: >-
    vArrayMirrorThruMesh takes an array of XYZ points and a mesh, finds the reference point on the
    mesh for each point, and puts the point on the opposite side of it. Blend sets how far the point
    moves toward the reflected position.
  description:
    - >-
      For each input point the node finds a reference point R: the closest Mesh Points vertex
      (Surface and Vertex give the same result) or the closest patch point (Face Centroid), the
      average of a vertex and its 7 nearest neighbors. The reflected position is 2 * R - P, and the
      output is P plus the difference to that position times Blend.
    - >-
      Blend runs from 0 to 1 and defaults to 1, which gives the full reflection. Affect X, Y and Z
      are checked by default, and an unchecked axis keeps the input value.
    - With no mesh vertices, no points are written and the output is empty.
  features:
    - title: Three reflection modes
      desc: >-
        Surface and Vertex reflect through the closest vertex, Face Centroid through averaged
        neighbors.
    - title: Blend amount
      desc: Blend moves the points part of the way to the reflected position.
    - title: Per-axis switches
      desc: Affect X, Y and Z restrict the result to the checked axes.
    - title: No mesh, no output
      desc: Without mesh vertices no points are written.
  connections:
    - label: Reflect a grid through a loaded mesh and draw
      lines:
        - vArrayPointsOnGrid.Output -> vArrayMirrorThruMesh.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayMirrorThruMesh.MeshPoints
        - vArrayMirrorThruMesh.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Reflect scattered points
      lines:
        - vArrayRandom.Output -> vArrayMirrorThruMesh.ArrayPoints
        - vArrayFromOBJ.Points -> vArrayMirrorThruMesh.MeshPoints
        - vArrayMirrorThruMesh.Output -> vArrayTranslate.Input
  difficulty: Advanced
  related:
    - name: vArrayMirror
      desc: Mirrors point arrays across an X, Y or Z axis with optional combine.
    - name: vArrayAttractToMesh
      desc: Lerps input points toward the nearest mesh surface point.
    - name: vArraySnapMeshVertex
      desc: Snaps each input point to the nearest mesh vertex.
  params:
    mirrortarget: >-
      Surface (default), Vertex or Face Centroid. Surface and Vertex use the closest Mesh Points
      vertex. Face Centroid uses the closest average of a vertex and its 7 nearest neighbors.
    blend: Mix between the original (0) and the reflected position (1). Range 0 to 1, default 1.
    inaffectx: X is reflected when checked (default), otherwise it keeps the input value.
    inaffecty: Y is reflected when checked (default), otherwise it keeps the input value.
    inaffectz: Z is reflected when checked (default), otherwise it keeps the input value.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    Surface and Vertex find the same reference point. All reference lists come from the same vertex
    list, so the fallback to the surface never changes the result: with no mesh vertices at all the
    points are not passed through, they are left out and the output is empty.
    vmeshutils.buildSurfaceSamples uses only the vertex list of Mesh Points. It makes one sample per
    vertex with all three triangle corners equal to that vertex, so every search finds the closest
    vertex and not a point on a face. The normal of a sample is fitted to the 8 nearest vertices and
    points away from the centroid of all vertices. Edges and faces are not read.
