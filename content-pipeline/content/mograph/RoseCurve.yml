operation: RoseCurve
tools:
  Array: vArrayRoseCurve
  ScriptVal: vScriptValRoseCurve
  JSON: vJSONRoseCurve
legacy_names: []
curated:
  tagline: >-
    Generate points on the polar rose r = amplitude * cos(petals * t), with rotation and scale
    controls.
  overview: >-
    vArrayRoseCurve has no input and outputs an array of XY points on a rose curve in the Z = 0
    plane. Petals sets the frequency of the curve and Amplitude sets its size.
  description:
    - >-
      The node samples t from 0 to 2 * pi in Sample Count points, including both ends. For each t
      the radius is r = Amplitude * cos(Petals * t) and the polar angle is t + Rotation. The point
      is X = r * cos(angle) * Scale and Y = r * sin(angle) * Scale, with Z = 0.
    - >-
      With the defaults (5 petals, Amplitude 0.25, 360 samples, Rotation 0, Scale 1) the curve has
      five petals, each reaching 0.25 from the origin. The first and last points are the same point.
    - >-
      Petals is a frequency. An odd value gives that many petals. An even value gives twice as many,
      because the curve covers the full 2 * pi range. Rotation is in degrees and turns the whole
      curve around the origin.
    - >-
      Petals is clamped to 1 or more and Sample Count to 8 or more. Raising Petals without raising
      Sample Count leaves fewer points per petal. Amplitude and Scale both multiply the result.
  features:
    - title: No input needed
      desc: The node generates its points from its own controls.
    - title: Integer petal frequency
      desc: Petals is a whole number from 1 upward.
    - title: Flat output
      desc: All points are written with Z = 0.
    - title: Rotation in degrees
      desc: Rotation turns the whole curve around the origin.
  connections:
    - label: Draw the rose
      lines:
        - vArrayRoseCurve.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Mirror the rose across an axis
      lines:
        - vArrayRoseCurve.Output -> vArrayMirror.Input
        - vArrayMirror.Output -> vArrayCameraProjection.ArrayA
  difficulty: Beginner
  related:
    - name: vArrayLemniscate
      desc: Uses the same polar form with a fixed frequency of 2.
    - name: vArraySuperellipse
      desc: Another closed 2D curve with rotation and scale controls.
    - name: vArrayLogarithmicSpiral
      desc: Generates points on a spiral instead of a closed curve.
  params:
    petals: Frequency in r = Amplitude * cos(Petals * t). Clamped to 1 or more, default 5.
    amplitude: Radius multiplier. Minimum 0.001, default 0.25.
    samplecount: Number of points sampled over the curve. Clamped to 8 or more, default 360.
    rotation: Angle added to the polar angle, in degrees. Default 0.
    scale: Multiplier applied to X and Y after the radius is computed. Minimum 0.001, default 1.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
