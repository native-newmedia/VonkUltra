operation: Wave
tools:
  Array: vArrayWave
  ScriptVal: vScriptValWave
  JSON: vJSONWave
legacy_names: []
curated:
  tagline: Moves points along a direction by a time-based wave, with a delay per point.
  overview: >-
    vArrayWave takes an array of XYZ points and adds (X, Y, Z Amount) * wave * Falloff to each
    point. Wave picks one of 13 wave shapes, and Point Delay staggers the wave along the array.
  description:
    - >-
      The wave value is computed from the frame time minus Point Delay times the point number, so
      the wave travels along the array. It is 0 until the frame passes Start At Frame (default 0).
      The shape comes from Wave and runs mostly between 0 and 1. It is multiplied by Strength
      (default 1), negated by Reverse, and multiplied by Falloff (default 0). The point moves by
      that times X, Y and Z Amount.
    - >-
      Period (default 5) is the length of one cycle in frames. With Limit on, the wave stops after
      Repeat Limit cycles. The 13 shapes are Line, Saw, Tri, Square, Sine, Noise, Pulse, ExpDecay,
      AbsSine, Stair, Bounce, Cosine and Spike. With the default Falloff of 0 and Amounts of 0,
      nothing moves.
  features:
    - title: 13 wave shapes
      desc: >-
        Line, Saw, Tri, Square, Sine, Noise, Pulse, ExpDecay, AbsSine, Stair, Bounce, Cosine and
        Spike.
    - title: Travelling wave
      desc: Point Delay shifts the wave in time for each point number.
    - title: Start and limit
      desc: Start At Frame delays the start, and Limit stops the wave after a number of cycles.
    - title: Direction by amount
      desc: X, Y and Z Amount set the direction and size of the move.
  connections:
    - label: Wave a grid and draw
      lines:
        - vArrayPointsOnGrid.Output -> vArrayWave.ArrayA
        - vArrayWave.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Wave a circle
      lines:
        - vArrayPointsOnCircle.Output -> vArrayWave.ArrayA
        - vArrayWave.Output -> vArrayTranslate.ArrayA
  difficulty: Intermediate
  related:
    - name: vArrayRippleDisplacer
      desc: Creates animated displacement with time-offset arrays.
    - name: vArraySin
      desc: Applies sine and cosine operations to an Array.
    - name: vArrayStagger
      desc: Animates points using staggered offsets.
  params:
    Wave: Shape of the wave. One of 13 shapes.
    DelayTime: Frame at which the wave starts. The wave is 0 before it. Minimum 0, slider to 2500, default 0.
    Period: Length of one cycle in frames. Minimum 0, slider 0 to 50, default 5.
    Strength: Multiplies the wave. Slider to 10, default 1.
    Limit: Stops the wave after Repeat Limit cycles when on. Default off.
    Reverse: Negates the wave when on. Default off.
    Falloff: Multiplies the wave before it is applied. Slider 0 to 1, default 0. Not a distance falloff.
    PointDelay: Time shift per point number, in frames. Minimum 0, slider 0 to 1, default 0.
    XPosition: X part of the move per unit of wave. Range -10 to 10, default 0.
    YPosition: Y part of the move per unit of wave. Range -10 to 10, default 0.
    ZPosition: Z part of the move per unit of wave. Range -10 to 10, default 0.
    ArrayA: Points to move.
    inRepeat: >-
      Number of cycles when Limit is on. Whole numbers from 0, slider 0 to 10, default 1. Shown when
      Limit is on.
    Delay: Hidden control. Not read by the code. Default 0.
    Offset: Hidden control. Added to the wave after Strength. Default 0.
    ShowInput: >-
      Hidden control. Shows the input ports of Start At Frame, Period, Strength and Limit when on.
      Default on.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    Changed in fix batch F1 (branch fix/findings-f1 of vonk-ultra-mograph), same change in all three
    families. The controls X, Y and Z Position were renamed X, Y and Z Amount (IDs XPosition,
    YPosition, ZPosition unchanged), because they are displacement amounts and not a wave origin.
    The code has no distance calculation. Each point moves by (X, Y, Z Amount) * wave * Falloff.
    Falloff is a multiplier (default 0), so nothing moves until both Falloff and one of the amounts
    are set. Delay (hidden) is not read; Offset (hidden) is added to the wave and defaults to 0.
    Show Input is hidden and shows the ports of Start At Frame, Period, Strength and Limit. Period 0
    divides by zero. The wave starts at 0 until the frame passes Start At Frame.
legacy_text: 'Animates an array Wave options include: - Line - Saw - Tri - Square - Sine - Noise'
