operation: PointsOnRectangle
tools:
  Array: vArrayPointsOnRectangle
  ScriptVal: vScriptValPointsOnRectangle
  JSON: vJSONPointsOnRectangle
legacy_names: []
curated:
  tagline: >-
    Generate outline points for a rectangle with rounded corners, written as pairs of points for
    each line segment.
  overview: >-
    vArrayPointsOnRectangle has no input and outputs an array of XY points along the outline of a
    rectangle in the Z = 0 plane. Width, Height and Border Radius set the shape, and Segments sets
    the points per corner.
  description:
    - >-
      The corner radius is Border Radius * min(Width, Height) / 2, so a Border Radius of 0 gives
      sharp corners and 1 rounds the shorter side completely. Each corner contributes Segments
      points along a quarter circle, starting on the side edge and stopping one step before the top
      or bottom edge. The straight edges are not sampled. They appear as the jump from the end of
      one corner arc to the start of the next.
    - >-
      The output is a list of line segments. The first point of the outline is appended at the end
      to close it, and then every pair of neighboring points is written out as two points, so each
      outline point appears twice. With the defaults (Segments 24, Width 0.5, Height 0.5, Border
      Radius 0.5) the outline has 96 points and the output has 192.
    - >-
      Width and Height are used as absolute values, and the rectangle is centered on the origin.
      With a Border Radius of 0 the 24 points in each corner are identical, so the corner positions
      repeat.
    - >-
      The fuse also has the hidden controls Line Strip, Loop and the four corner checkboxes. The
      code tests them as boolean values, and a Lua number, including 0, counts as true, so changing
      them has no effect. The outline is always closed, always written as segment pairs, and all
      four corners are always rounded.
  features:
    - title: No input needed
      desc: The node generates its points from its own controls.
    - title: Rounded corners
      desc: Border Radius runs from sharp corners at 0 to a fully rounded short side at 1.
    - title: Segment pairs
      desc: The output lists each line segment as two consecutive points.
    - title: Flat output
      desc: All points are written with Z = 0.
  connections:
    - label: Draw the rectangle
      lines:
        - vArrayPointsOnRectangle.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the rectangle before drawing
      lines:
        - vArrayPointsOnRectangle.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Beginner
  related:
    - name: vArraySuperellipse
      desc: A closed 2D curve that approaches a rectangle as its exponent grows.
    - name: vArrayPointsOnCircle
      desc: Places points on a circle.
    - name: vArrayPointsOnHexagon
      desc: Places points on a staggered grid.
  params:
    Segments: Number of points in each rounded corner. Range 1 to 100, default 24.
    width: Width of the rectangle, used as an absolute value. Default 0.5.
    height: Height of the rectangle, used as an absolute value. Default 0.5.
    borderRadius: >-
      Corner radius as a fraction of half the shorter side. 0 gives sharp corners and 1 gives a
      fully rounded short side. Default 0.5.
    LineStrip: >-
      Hidden control. No effect, because the code treats any value as on and always writes segment
      pairs. Default off.
    loop: >-
      Hidden control. No effect, because the code treats any value as on and always closes the
      outline. Default off.
    TopLeftCorner: >-
      Hidden control. No effect, because the code treats any value as on and always rounds this
      corner. Default on.
    TopRightCorner: >-
      Hidden control. No effect, because the code treats any value as on and always rounds this
      corner. Default on.
    BottomLeftCorner: >-
      Hidden control. No effect, because the code treats any value as on and always rounds this
      corner. Default on.
    BottomRightCorner: >-
      Hidden control. No effect, because the code treats any value as on and always rounds this
      corner. Default on.
status:
  source: ai
  state: ai
  reviewed_hash: null
  connections_source: docsify
  prompt_version: '1'
  note: >-
    Process() tests the Line Strip, Loop and four corner checkbox values with if value then. A Lua
    number is always true, including 0, so these hidden controls cannot change the output. Fuse
    logic was not changed.
legacy_text: Generate points on Rectangle
