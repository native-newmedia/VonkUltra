operation: PointsOnRectangle
tools:
  Array: vArrayPointsOnRectangle
  ScriptVal: vScriptValPointsOnRectangle
  JSON: vJSONPointsOnRectangle
legacy_names: []
curated:
  tagline: >-
    Generate outline points for a rectangle with rounded corners, written as pairs of points for
    each line segment.
  overview: >-
    vArrayPointsOnRectangle has no input and outputs an array of XY points along the outline of a
    rectangle in the Z = 0 plane. Width, Height and Border Radius set the shape, and Segments sets
    the points per corner.
  description:
    - >-
      The corner radius is Border Radius * min(Width, Height) / 2, so 0 gives sharp corners and 1
      rounds the shorter side fully. Each rounded corner contributes Segments points along a quarter
      circle. Straight edges are not sampled, they appear as the jump between the end of one arc and
      the start of the next. Width and Height are absolute values and the rectangle is centered on
      the origin.
    - >-
      The four corner checkboxes (default on) are hidden. A corner that is off gives one sharp
      corner point instead of an arc. Loop (default off) adds the first point at the end. Line Strip
      (default off) writes every pair of neighboring points as two points, so each point appears
      twice. With the defaults (Segments 24) the output has 96 points.
  features:
    - title: No input needed
      desc: The node generates its points from its own controls.
    - title: Rounded corners
      desc: Border Radius runs from sharp corners at 0 to a fully rounded short side at 1.
    - title: Optional segment pairs
      desc: Line Strip lists each line segment as two consecutive points.
    - title: Flat output
      desc: All points are written with Z = 0.
  connections:
    - label: Draw the rectangle
      lines:
        - vArrayPointsOnRectangle.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the rectangle before drawing
      lines:
        - vArrayPointsOnRectangle.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Beginner
  related:
    - name: vArraySuperellipse
      desc: A closed 2D curve that approaches a rectangle as its exponent grows.
    - name: vArrayPointsOnCircle
      desc: Places points on a circle.
    - name: vArrayPointsOnHexagon
      desc: Places points on a staggered grid.
  params:
    Segments: Number of points in each rounded corner. Range 1 to 100, default 24.
    width: Width of the rectangle, used as an absolute value. Default 0.5.
    height: Height of the rectangle, used as an absolute value. Default 0.5.
    borderRadius: >-
      Corner radius as a fraction of half the shorter side. 0 gives sharp corners and 1 gives a
      fully rounded short side. Default 0.5.
    LineStrip: >-
      Hidden control. When on, every pair of neighboring points is written as two points. Default
      off.
    loop: Hidden control. When on, the first point is added at the end of the outline. Default off.
    TopLeftCorner: >-
      Hidden control. When on, this corner is an arc of Segments points, when off one sharp corner
      point. Default on.
    TopRightCorner: >-
      Hidden control. When on, this corner is an arc of Segments points, when off one sharp corner
      point. Default on.
    BottomLeftCorner: >-
      Hidden control. When on, this corner is an arc of Segments points, when off one sharp corner
      point. Default on.
    BottomRightCorner: >-
      Hidden control. When on, this corner is an arc of Segments points, when off one sharp corner
      point. Default on.
status:
  source: ai
  state: ai
  reviewed_hash: null
  connections_source: docsify
  prompt_version: '1'
  note: >-
    Rewritten against the fuse after fix batch F3 (branch fix/findings-f3 of vonk-ultra-mograph).
    Process() tested the Line Strip, Loop and four corner checkbox values with if value then, so the
    hidden controls had no effect. They are now tested with > 0.5, so Loop and Line Strip default to
    off and the default output is no longer closed or written as pairs. Nothing was run in Fusion.
