operation: RotateValues
tools:
  Array: vArrayRotateValues
  ScriptVal: vScriptValRotateValues
  JSON: vJSONRotateValues
legacy_names: []
curated:
  tagline: Cycles the elements of an array forward or backward by a number of positions.
  overview: >-
    vArrayRotateValues takes an array and moves every element by Rotate Amount positions, wrapping
    the elements that fall off one end around to the other. Rotate Amount is the only setting.
  description:
    - >-
      With Rotate Amount 1 (the default) every element moves one place toward the end, and the last
      element becomes the first. A negative amount moves the elements toward the start, and the
      first element becomes the last. The amount can be -100 to 100, whole numbers, and a larger
      amount than the array length wraps around.
    - >-
      The elements can be numbers, points or lists, and they are not changed. Show Input makes the
      Rotate Amount input port visible, so the amount can be connected to another node. The hidden
      Pass Thru control has no effect.
  features:
    - title: Wrapping shift
      desc: Elements that leave one end re-enter at the other end.
    - title: Both directions
      desc: Positive amounts shift toward the end and negative amounts toward the start.
    - title: Any element type
      desc: Numbers, points and lists are moved without being changed.
    - title: Connectable amount
      desc: Show Input exposes Rotate Amount as an input port.
  connections:
    - label: Cycle the points of a ring and draw
      lines:
        - vArrayPointsOnCircle.Output -> vArrayRotateValues.ArrayA
        - vArrayRotateValues.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Shift a list for a stagger
      lines:
        - vArrayCreateRange.Output -> vArrayRotateValues.ArrayA
        - vArrayRotateValues.Output -> vArrayMath.ArrayA
  difficulty: Beginner
  related:
    - name: vArrayReverse
      desc: Reverses or reorders an array within a specified index range.
    - name: vArraySlicer
      desc: Trims the start and end of single or multi-dimensional arrays.
    - name: vArrayStagger
      desc: Animates points using staggered offsets.
  params:
    rotateamount: >-
      Number of positions to shift. Whole numbers from -100 to 100, default 1. Positive moves toward
      the end.
    passthru: Hidden control. Has no effect in the code. Default off.
    ShowInput: Shows the input port of Rotate Amount when on. Default off.
    ArrayA: Array whose elements are shifted.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    Pass Thru is a hidden control and has no effect: it only changes a fallback value that is not
    used because the rotation amount is always given. The old text says it bypasses the rotation.
    Show Input makes the input port of Rotate Amount visible; the old text said it reveals the Array
    A port. The Array fuse needs the array and size wrapper on the input. An empty array is not
    handled.
legacy_text: Rotate Array Between Operations on an Array
