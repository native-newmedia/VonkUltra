operation: Lemniscate
tools:
  Array: vArrayLemniscate
  ScriptVal: vScriptValLemniscate
  JSON: vJSONLemniscate
legacy_names: []
curated:
  tagline: Generate points on the polar curve r = amplitude * cos(2t), with rotation and scale controls.
  overview: >-
    vArrayLemniscate has no input and outputs an array of XY points on a closed curve in the Z = 0
    plane. Amplitude sets the size, Sample Count sets the number of points, and Rotation turns the
    curve.
  description:
    - >-
      The node samples t from 0 to 2 * pi in Sample Count points, including both ends. For each t
      the radius is r = Amplitude * cos(2t) and the polar angle is t + Rotation. The point is X = r
      * cos(angle) * Scale and Y = r * sin(angle) * Scale, with Z = 0.
    - >-
      With the defaults (Amplitude 0.25, 360 samples, Rotation 0, Scale 1) the curve has four lobes
      along the X and Y axes, each reaching 0.25 from the origin. The first and last points are the
      same point.
    - >-
      Rotation is in degrees and is added to the polar angle, so it turns the whole curve around the
      origin. Amplitude and Scale both multiply the result, so they change the size in the same way.
    - >-
      Sample Count is clamped to 8 or more. The curve is r = a * cos(2t), which is the polar rose
      with two as the frequency (see vArrayRoseCurve with Petals set to 2). It is not the
      figure-eight lemniscate of Bernoulli, which is defined by r squared = a squared * cos(2t).
  features:
    - title: No input needed
      desc: The node generates its points from its own controls.
    - title: Flat output
      desc: All points are written with Z = 0.
    - title: Closed sampling
      desc: The curve is sampled over the full 2 * pi range, so the last point repeats the first.
    - title: Rotation in degrees
      desc: Rotation turns the whole curve around the origin.
  connections:
    - label: Draw the curve
      lines:
        - vArrayLemniscate.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the curve before drawing
      lines:
        - vArrayLemniscate.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Beginner
  related:
    - name: vArrayRoseCurve
      desc: The same polar form with a Petals control in place of the fixed frequency of 2.
    - name: vArraySuperellipse
      desc: Another closed 2D curve with amplitude, rotation and scale controls.
    - name: vArrayLissajousSpline
      desc: Generates points on a Lissajous curve.
  params:
    amplitude: Radius multiplier in r = Amplitude * cos(2t). Minimum 0.001, default 0.25.
    samplecount: Number of points sampled over the curve. Clamped to 8 or more, default 360.
    rotation: Angle added to the polar angle, in degrees. Default 0.
    scale: Multiplier applied to X and Y after the radius is computed. Minimum 0.001, default 1.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
