operation: CreateFont
tools:
  Array: vArrayCreateFont
  ScriptVal: vScriptValCreateFont
  JSON: vJSONCreateFont
legacy_names: []
curated:
  tagline: >-
    Convert text into outline points using a JSON font definition read from a file, a URL or pasted
    text.
  overview: >-
    vArrayCreateFont reads a JSON font that maps each character to its outline data and outputs the
    outline points of the text in Styled Text, and a Groups output with the number of outlines for
    each character. Input Source chooses where the font comes from.
  description:
    - >-
      The font is a JSON object whose keys are characters. Each value is a list of outlines, and
      each outline is a flat list of X and Y values. The node looks up every character of the text,
      divides the coordinates by 5000, and places the characters one after another. The next
      character starts at the largest X of the previous one plus 1000 * Character Spacing, measured
      in font units. A space adds 1000 * Line Spacing instead, so that control works as word
      spacing.
    - >-
      Letter Case sets the text to upper case or lower case before the lookup, or leaves it as it
      is. Flip X is on by default and negates X, and Flip Y negates Y. Sample Points keeps every Nth
      outline of each character, starting with the first, and drops the others. The default of 1
      keeps all of them.
    - >-
      Horizontal Adjustment and Vertical Adjustment are then added, the points are rotated by X, Y
      and Z Rotation with the matrices multiplied in X, Y, Z order, and X, Y and Z Offset are added.
      The values are multiplied by the scale. The scale is Size when Lock X/Y is on, and X Scale and
      Y Scale when it is off.
    - >-
      Every character other than a space must exist in the font, otherwise the node stops with an
      error. The Groups output holds one number for each character, the count of outlines that were
      kept. The Output socket is the points of all outlines in order. Rotation Order and
      Justification are hidden and are not used.
  features:
    - title: Font from JSON
      desc: The font definition comes from a file, a URL or text typed into the node.
    - title: Letter case control
      desc: Letter Case sets the text to upper case or lower case before the font lookup.
    - title: Flip and thin outlines
      desc: Flip X, Flip Y and Sample Points change the orientation and the number of outlines.
    - title: Groups output
      desc: One number for each character gives the count of its outlines.
  connections:
    - label: Draw the text outlines with their groups
      lines:
        - vArrayCreateFont.Output -> vArrayCameraProjection.ArrayA
        - vArrayCreateFont.ScriptVal_Groups -> vArrayCameraProjection.ArrayGroups
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - vArrayCameraProjection.Groups -> vArrayShapeRender.ArrayGroups
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the text before drawing
      lines:
        - vArrayCreateFont.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Advanced
  related:
    - name: vArrayTextFont
      desc: Creates outline points of text from a built-in font.
    - name: vArrayGenerateText
      desc: Generates random text items.
    - name: vArrayFromXYZ
      desc: Reads ASCII XYZ point cloud data.
  params:
    InputSource: Where the JSON font comes from, File, URL or Text. Default File.
    Filename: Path of the JSON font file. Shown when Input Source is File.
    URL: Address of a JSON font. Shown when Input Source is URL.
    Input: JSON font text typed or pasted into the node. Shown when Input Source is Text.
    StyledText: Text to convert.
    Size: Scale of the text when Lock X/Y is on. Default 1.
    CharacterSpacing: Gap added after each character, in units of 1000 font units. Default 0.05.
    Case: Changes the text to ORIGINAL, UPPER or LOWER case before the lookup. Default ORIGINAL.
    FlipX: Negates X. Default on.
    FlipY: Negates Y. Default off.
    Hori_adjustment: Value added to X of every point before rotation. Range -0.5 to 0.5.
    Ver_adjustment: Value added to Y of every point before rotation. Range -0.5 to 0.5.
    sample_points: Keeps every Nth outline of each character. Range 1 to 10, default 1.
    Translate.X: Offset in X, added after rotation and then scaled.
    Translate.Y: Offset in Y, added after rotation and then scaled.
    Translate.Z: Offset in Z, added after rotation and then scaled.
    Rotate.X: Rotation around the X axis, in degrees.
    Rotate.Y: Rotation around the Y axis, in degrees.
    Rotate.Z: Rotation around the Z axis, in degrees.
    Scale.Y: Hidden control. Scale in Y when Lock X/Y is off. Default 1.
    lineSpacing: >-
      Hidden control. Distance added for each space, in units of 1000 font units, which works as
      word spacing.
    Justification: Hidden control. It is not used in the calculation.
    RotOrder: Hidden control. It is not used, the rotation is always applied in X, Y, Z order.
    LockXY: >-
      Hidden control. When on, the scale comes from Size. When off, X Scale and Y Scale are used.
      Default on.
    Scale.X: Hidden control. Scale in X, also used for Z, when Lock X/Y is off. Default 1.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The JSON font format was inferred from the code and no font file was checked. Sample Points
    thins the outlines of each character, not the points inside an outline. A character that is
    missing from the font raises an error.
