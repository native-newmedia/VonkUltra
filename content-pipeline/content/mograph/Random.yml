operation: Random
tools:
  Array: vArrayRandom
  ScriptVal: vScriptValRandom
  JSON: vJSONRandom
legacy_names:
  - vArrayCreateRandom
curated:
  tagline: >-
    Generate an array of random values between a low and a high limit, packed as X, X Y or X Y Z
    entries.
  overview: >-
    vArrayRandom has no input and outputs an array of random entries. Array length sets the number
    of entries, Pack To sets how many values each entry holds, and the Low and High range sets the
    limits.
  description:
    - >-
      The node seeds Lua's random generator with Seed and writes Array length entries. Every value
      is drawn from a uniform distribution between Low and High. The same Seed gives the same
      output.
    - >-
      Pack To selects the entry size: X gives one value per entry, X Y gives two and X Y Z gives
      three. The same Low and High apply to every value in an entry. With the defaults (Array length
      2, Low -1, High 1, X Y Z) the node outputs two entries of three values each, so it can be used
      directly as XYZ points.
    - >-
      Array length has a minimum of 2. Seed is a whole number from a slider with a displayed range
      of -100 to 100 and no limit in the code. Use vArrayMinMax if each value needs its own range.
  features:
    - title: No input needed
      desc: The node generates its values from its own controls.
    - title: Repeatable output
      desc: Seed fixes the sequence, so the same settings give the same values.
    - title: Entry size choice
      desc: Pack To writes entries of one, two or three values.
    - title: One shared range
      desc: Low and High apply to every value in the output.
  connections:
    - label: Draw random points
      lines:
        - vArrayRandom.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Offset the points before drawing
      lines:
        - vArrayRandom.Output -> vArrayTranslate.ArrayA
        - vArrayTranslate.Output -> vArrayCameraProjection.ArrayA
  difficulty: Beginner
  related:
    - name: vArrayMinMax
      desc: The same idea with a separate range for each value in an entry.
    - name: vArrayNoise
      desc: Generates random points in a cube, with optional animated motion.
    - name: vArrayCreateRange
      desc: Creates a range of values as an array.
  params:
    arrayLength: Number of entries in the output. Minimum 2, default 2.
    Seed: Seed of the random generator. Default 0.
    InputNumber: Number of values in each entry, X, X Y or X Y Z. Default X Y Z.
    Low: Lower end of the range the values are drawn from. Default -1.
    High: Upper end of the range the values are drawn from. Default 1.
    Multiply: Hidden control. It is read by the node but has no effect on the output. Default 0.
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: The hidden Multiply control is read into mul and never used. Fuse logic was not changed.
