operation: Convert2D_3D
tools:
  Array: vArrayConvert2D_3D
  ScriptVal: vScriptValConvert2D_3D
  JSON: vJSONConvert2D_3D
legacy_names: []
curated:
  tagline: Regroups the values of each array element into groups of 1, 2 or 3 values.
  overview: >-
    vArrayConvert2D_3D takes an array of value lists and cuts each list into groups of the size
    chosen by Convert To. With X Y Z, a 2D point {x, y} becomes {x, y, 0}.
  description:
    - >-
      Convert To sets the group size: X is 1, X Y is 2 and X Y Z is 3. Each input element is read
      from the start in groups of that size, and each group becomes one element of the output.
      Groups never span two input elements.
    - >-
      With X Y Z, a last group that has fewer than 3 values is filled with 0, so {x, y} becomes {x,
      y, 0}. With X or X Y, a short last group stays short. A 3D point converted with X Y becomes
      {x, y} followed by {z}.
    - The output has one element per group, so its length can be larger than the input length.
  features:
    - title: Three group sizes
      desc: X, X Y and X Y Z cut the values into groups of 1, 2 or 3.
    - title: 2D to 3D
      desc: In the X Y Z setting, 2D points get a Z value of 0.
    - title: Per-element grouping
      desc: Each input element is grouped on its own.
    - title: Single control
      desc: Convert To is the only setting.
  connections:
    - label: Lift a 2D path into 3D and draw it
      lines:
        - vArrayFromPolyline.Output -> vArrayConvert2D_3D.ArrayA
        - vArrayConvert2D_3D.Output -> vArrayCameraProjection.ArrayA
        - vArrayCameraProjection.Output -> vArrayShapeRender.ArrayPoint
        - Background.Output -> vArrayShapeRender.Input
    - label: Convert grid points
      lines:
        - vArrayPointsOnGrid.Output -> vArrayConvert2D_3D.ArrayA
        - vArrayConvert2D_3D.Output -> vArrayTranslate.Input
  difficulty: Beginner
  related:
    - name: vArrayPacker
      desc: Packs an Array into a new array.
    - name: vArrayUnPacker
      desc: Unpacks an Array into individual values.
    - name: vArraySlicer
      desc: Trims the start and end of single or multi-dimensional arrays.
  params:
    InputNumber: >-
      Group size: X (1 value, default), X Y (2 values) or X Y Z (3 values, with the last group
      padded with 0).
status:
  source: ai
  state: ai
  reviewed_hash: null
  prompt_version: '1'
  note: >-
    The registered description says the node converts a 2D array to a 3D array. The code regroups
    the values of each input element into groups of 1, 2 or 3 values, so it can also split 3D
    points. A group shorter than 3 is padded with 0 only in the X Y Z setting. The JSON fuse writes
    the output with indentation.
